name: CI

on:
  push:
    branches: ['**']   # 所有分支都触发——防止开发分支积累类型/编译错误到发版才暴露
  pull_request:
  workflow_dispatch:

# 同一分支新 push 取消旧运行（省额度：全分支触发下这是最大的浪费点）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限（防 token 泄漏面；上传 artifact 的 job 自行提升 permissions）。
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - name: 文件行数门禁(单文件 ≤400 行,棘轮 baseline)
        working-directory: ${{ github.workspace }}
        run: bash scripts/check_file_length.sh check
      - run: go mod download
      - run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v1.62
          working-directory: backend
          args: --timeout 5m
      - run: go test ./... -race -short -timeout 30m   # -short 跳过真实网络/子进程时序用例（race 放大下易超时 flaky），race 聚焦并发逻辑；30m 防 race 慢化卡死
      - name: Enforce targeted coverage floors
        shell: bash
        run: |
          check_coverage() {
            local package="$1"
            local minimum="$2"
            local profile="$RUNNER_TEMP/$(echo "$package" | tr '/.' '__').cover"
            go test "$package" -short -count=1 -coverprofile="$profile"
            local actual
            actual=$(go tool cover -func="$profile" | awk '/^total:/ {gsub("%", "", $3); print $3}')
            awk -v actual="$actual" -v minimum="$minimum" 'BEGIN {
              if (actual + 0 < minimum + 0) {
                printf "coverage %.1f%% is below %.1f%%\n", actual, minimum
                exit 1
              }
              printf "coverage %.1f%% meets %.1f%% floor\n", actual, minimum
            }'
          }
          check_coverage ./internal/api/v1 30
          check_coverage ./internal/workflow/nodes 20
          check_coverage ./internal/downloader/manager 90
      - run: go build ./...

  frontend:
    name: Frontend (Vue3)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck   # vue-tsc 严格类型检查（vite build 用 esbuild 擦除类型，单独跑 typecheck 才能抓类型错误）
      - run: npx eslint src      # i18n 防回潮门禁：已迁移页面禁止硬编码中文（eslint.config.mjs 的 I18N_DONE 列表）
      - run: npm run build
      # 摄像头预览的 jessibuca 解码器是 GPL-3.0，绝不能进分发产物。
      # vite 会把 public/ 原样拷进 dist，故本地残留即会被带出去（.dockerignore 拦不住，
      # 因为构建发生在容器内、用的是已 COPY 的工作区内容）。这里做最终断言。
      - run: bash ../scripts/check-no-gpl-assets.sh "$PWD/dist"

  backend-windows:
    name: Backend Windows
    runs-on: windows-latest
    timeout-minutes: 40
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - run: go test ./internal/plugins ./internal/filemanager ./internal/cloud ./internal/api/... -short -timeout 20m
      - run: go build ./...

  plugin-sdk:
    name: Plugin SDK and Market
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '20' }
      - name: Test Python SDK
        working-directory: sdk/python
        run: PYTHONPATH=src python -m unittest discover -s test -v
      - name: Validate plugin sources and manifests
        run: |
          export PYTHONPATH="$PWD/sdk/python/src"
          python -m py_compile market-plugins/*/*.py
          for plugin in market-plugins/*; do
            python -m ptpatronus_plugin_sdk.pluginctl validate "$plugin"
          done
          python -m ptpatronus_plugin_sdk.pluginctl market aggregate \
            --packages-dir examples/plugin-market/packages \
            --public-key examples/plugin-market/keys/plugin-market.public.key \
            --archives-dir examples/plugin-market/archives \
            --out "$RUNNER_TEMP/plugin-market.json"
      - name: Test TypeScript SDK
        working-directory: sdk/typescript
        run: npm install --no-package-lock --no-audit --no-fund && npm test && npm run build

  flutter:
    name: Client (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.x'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  flutter-windows:
    name: Client Windows Build
    runs-on: windows-latest
    timeout-minutes: 40
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.x'
          cache: true
      - run: flutter pub get
      - run: flutter build windows --debug

  release-manifest:
    name: Release Manifest Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '20' }
      - run: node scripts/validate-update-manifest.mjs

  extension:
    name: Browser Extension
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '20' }
      # 安全基线：manifest 声明面 + innerHTML 拼接审计（XSS 静态门禁）+ 纯函数行为
      # CookieCloud：协议派生与负载形状（钉 crypto-js 真实向量，防 AES-128 退化）
      # （显式列测试文件——node --test 传目录在部分平台会当模块解析而失败）
      - run: node --test extension/test/security.test.mjs extension/test/cookiecloud.test.mjs

  e2e:
    name: E2E (Playwright core flow)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write   # playwright-report artifact 上传
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # HXPT_EMERGENCY_ADMIN：登录链路离线化（仅测试进程注入，生产不受影响）
      - name: Run core flow E2E
        working-directory: frontend
        run: npx playwright test
        env:
          CI: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      # govulncheck 只报"实际可达"的漏洞（比盲扫误报率低）；发现即 fail
      - name: govulncheck (backend)
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: cd backend && govulncheck ./...
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '20' }
      # audit 级别 >=high 只告警不阻断（历史依赖积压逐步还）
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high || echo "::warning::frontend has high/critical vulnerable deps, see log above"
