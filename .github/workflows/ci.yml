name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - run: go mod download
      - run: go vet ./...
      - run: go test ./... -race -short -timeout 30m   # -short 跳过真实网络/子进程时序用例（race 放大下易超时 flaky），race 聚焦并发逻辑；30m 防 race 慢化卡死
      - name: Enforce targeted coverage floors
        shell: bash
        run: |
          check_coverage() {
            local package="$1"
            local minimum="$2"
            local profile="$RUNNER_TEMP/$(echo "$package" | tr '/.' '__').cover"
            go test "$package" -short -count=1 -coverprofile="$profile"
            local actual
            actual=$(go tool cover -func="$profile" | awk '/^total:/ {gsub("%", "", $3); print $3}')
            awk -v actual="$actual" -v minimum="$minimum" 'BEGIN {
              if (actual + 0 < minimum + 0) {
                printf "coverage %.1f%% is below %.1f%%\n", actual, minimum
                exit 1
              }
              printf "coverage %.1f%% meets %.1f%% floor\n", actual, minimum
            }'
          }
          check_coverage ./internal/api/v1 10
          check_coverage ./internal/workflow/nodes 20
          check_coverage ./internal/downloader/manager 90
      - run: go build ./...

  frontend:
    name: Frontend (Vue3)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck   # vue-tsc 严格类型检查（vite build 用 esbuild 擦除类型，单独跑 typecheck 才能抓类型错误）
      - run: npm run build

  backend-windows:
    name: Backend Windows
    runs-on: windows-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - run: go test ./internal/plugins ./internal/filemanager ./internal/cloud ./internal/api/... -short -timeout 20m
      - run: go build ./...

  plugin-sdk:
    name: Plugin SDK and Market
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Test Python SDK
        working-directory: sdk/python
        run: PYTHONPATH=src python -m unittest discover -s test -v
      - name: Validate plugin sources and manifests
        run: |
          export PYTHONPATH="$PWD/sdk/python/src"
          python -m py_compile market-plugins/*/*.py
          for plugin in market-plugins/*; do
            python -m ptpatronus_plugin_sdk.pluginctl validate "$plugin"
          done
          python -m ptpatronus_plugin_sdk.pluginctl market aggregate \
            --packages-dir examples/plugin-market/packages \
            --public-key examples/plugin-market/keys/plugin-market.public.key \
            --archives-dir examples/plugin-market/archives \
            --out "$RUNNER_TEMP/plugin-market.json"
      - name: Test TypeScript SDK
        working-directory: sdk/typescript
        run: npm install --no-package-lock --no-audit --no-fund && npm test && npm run build

  flutter:
    name: Client (Flutter)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  flutter-windows:
    name: Client Windows Build
    runs-on: windows-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          cache: true
      - run: flutter pub get
      - run: flutter build windows --debug
