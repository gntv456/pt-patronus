name: Flutter Release

# 打 tag (v*) 时构建客户端产物：Android APK（签名）/ macOS / Windows / iOS（未签名 ipa,用户 AltStore/TrollStore 自签）。
# 鸿蒙需华为 flutter 分支 + DevEco，CI 无 runner，手动构建（见 README/各端发布步骤.md）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.41.x', cache: true }
      - run: flutter pub get
      # release 签名：tag 触发时注入 keystore（需配 secrets；未配则 build.gradle.kts 回退 debug 签名）
      - name: Inject release keystore
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 -d > android/app/ptpatronus.jks
          {
            echo "storePassword=$STORE_PW"
            echo "keyPassword=$KEY_PW"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=ptpatronus.jks"
          } > android/key.properties
      # --split-per-abi：按 CPU 架构拆分,避免 fat-APK 把 3 份原生库(media_kit libmpv / webview)塞一个包。
      # 产 3 个 APK,publish 只发 arm64-v8a(95% 手机)+ armeabi-v7a(老设备),x86_64 模拟器丢弃。
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: ptpatronus-android
          path: mobile/build/app/outputs/flutter-apk/*.apk

  macos:
    name: macOS
    runs-on: macos-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.41.x', cache: true }
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip .app
        run: |
          # 诊断：曾出现 build exit 0 但 zip 找不到 *.app——先 ls 目录暴露 build 实际产物。
          cd build/macos/Build/Products/Release || { echo "Release dir missing"; ls -R build/macos/Build/Products 2>/dev/null; exit 1; }
          echo "=== Release dir contents ==="
          ls -la
          app=$(find . -name "*.app" -maxdepth 2 | head -1)
          if [ -z "$app" ]; then echo "No .app found — build 未产出,查 Run flutter build macos 步骤日志"; exit 1; fi
          zip -r -y "$GITHUB_WORKSPACE/ptpatronus-macos.zip" "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: ptpatronus-macos
          path: ptpatronus-macos.zip

  windows:
    name: Windows
    runs-on: windows-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.41.x', cache: true }
      - run: flutter pub get
      # flutter_inappwebview_windows 用了 <experimental/coroutine>，新版 MSVC(VS18) 的 STL1011 弃用转 error。
      # 经 CL 环境变量全局定义抑制宏（作用于所有 .vcxproj，含插件子项目）。
      - run: flutter build windows --release
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
      - uses: actions/upload-artifact@v4
        with:
          name: ptpatronus-windows
          path: mobile/build/windows/x64/runner/Release/

  ios:
    name: iOS (unsigned)
    runs-on: macos-latest
    continue-on-error: true   # 首次可能踩插件兼容坑,失败不阻塞核心发版（不在 publish needs）
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.41.x', cache: true }
      - run: flutter pub get
      # --no-codesign：跳过签名,开发者无需 $99 Apple 账号。产未签名 .app → 打包 ipa。
      # 用户拿未签名 ipa 用 AltStore（免费 Apple ID,7 天重签）或 TrollStore（永久免签）自签。
      - run: flutter build ios --release --no-codesign
      - name: Pack unsigned ipa
        run: |
          app=$(find build/ios/iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$app" ]; then echo "No .app in build/ios/iphoneos"; ls -R build/ios/iphoneos 2>/dev/null; exit 1; fi
          mkdir Payload && cp -r "$app" Payload/
          zip -r -y ptpatronus-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ptpatronus-ios
          path: mobile/ptpatronus-ios-unsigned.ipa

  # tag 触发时把各端产物挂到 GitHub Release，方便汇总后转到网盘/TG 群分发。
  # 注意：Private 仓库的 Release 资产外部无法直链下载，本步是给仓库 owner 批量取产物用的。
  publish-release:
    name: Publish to Release
    needs: [android, macos, windows]   # 不含 ios：ios 失败不卡核心发版（best-effort 进 Release）
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 安装包命名规范：ptpatronus-<版本>-<平台>.<扩展>，下载后一眼识别版本/平台。
      # agent 二进制（release.yml）保持固定名——install.sh 依赖 releases/latest/download 固定路径自动拉取。
      - name: Compute version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with: { name: ptpatronus-android, path: android }
      - uses: actions/download-artifact@v4
        with: { name: ptpatronus-macos, path: macos }
      - uses: actions/download-artifact@v4
        with: { name: ptpatronus-windows, path: windows }
      - name: Download iOS (best-effort)
        uses: actions/download-artifact@v4
        with: { name: ptpatronus-ios, path: ios }
        continue-on-error: true        # ios job 可能失败,无 artifact 时跳过
      - name: Rename artifacts with version + platform
        run: |
          # Android split-per-abi：发 arm64-v8a(95% 手机)+ armeabi-v7a(老设备),x86_64 模拟器丢弃
          mv android/*-arm64-v8a-release.apk "ptpatronus-${VERSION}-android-arm64.apk"
          mv android/*-armeabi-v7a-release.apk "ptpatronus-${VERSION}-android-armv7a.apk"
          rm -f android/*-x86_64-release.apk
          mv macos/ptpatronus-macos.zip "ptpatronus-${VERSION}-macos.zip"
          cd windows && zip -r "../ptpatronus-${VERSION}-windows-x64.zip" . && cd ..
          if [ -f ios/*.ipa ]; then mv ios/*.ipa "ptpatronus-${VERSION}-ios-unsigned.ipa"; else echo "ios 缺失,跳过"; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ptpatronus-${{ env.VERSION }}-android-arm64.apk
            ptpatronus-${{ env.VERSION }}-android-armv7a.apk
            ptpatronus-${{ env.VERSION }}-macos.zip
            ptpatronus-${{ env.VERSION }}-windows-x64.zip
            ptpatronus-${{ env.VERSION }}-ios-unsigned.ipa
          fail_on_unmatched_files: false   # ios 可能缺失（best-effort）

  # 鸿蒙(ohos)：需华为 flutter 分支 + DevEco Studio 环境，CI 无现成 runner，
  # 请在配置好鸿蒙 SDK 的机器上手动：flutter build hap --release（鸿蒙分支）。
