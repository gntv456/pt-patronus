name: Release

# 打 tag (v*) 时构建并发布监控 agent 二进制到 GitHub Release，
# 供 install.sh 的 `releases/latest/download/ptpatronus-agent-linux-<arch>` 下载。
# （Docker 镜像由 docker.yml 负责；这里只发 agent 独立二进制。）
# 供应链审计修复：agent 二进制重新回到 CI 构建（ubuntu 单架构约 2 分钟，额度成本可忽略）
# ——本机构建 + 第三方镜像无校验下载曾是供应链最薄弱一环。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # 创建 GitHub Release

jobs:
  agent:
    name: Agent binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - run: go mod download

      # 计算版本号写入 GITHUB_ENV，供下方两个 build 的 ldflags -X 注入 internal/version.Version。
      - name: Compute version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="${GITHUB_REF_NAME#v}"; else v="dev"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      # 纯 Go（CGO_ENABLED=0）交叉编译，产物名对齐 install.sh 的下载路径。
      - name: Build agent linux/amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X github.com/hxpt/ptpatronus/internal/version.Version=$VERSION" -o ../ptpatronus-agent-linux-amd64 ./cmd/ptpatronus-agent
      - name: Build agent linux/arm64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X github.com/hxpt/ptpatronus/internal/version.Version=$VERSION" -o ../ptpatronus-agent-linux-arm64 ./cmd/ptpatronus-agent

      - name: Write agent checksums
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        run: sha256sum ptpatronus-agent-linux-amd64 ptpatronus-agent-linux-arm64 > SHA256SUMS-agent.txt

      # 仅 tag 触发时发 Release（workflow_dispatch 只验证构建）。
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ptpatronus-agent-linux-amd64
            ptpatronus-agent-linux-arm64
            SHA256SUMS-agent.txt
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload agent to ptang
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          bash .github/scripts/upload-release-assets.sh "$VERSION" \
            ptpatronus-agent-linux-amd64 \
            ptpatronus-agent-linux-arm64 \
            SHA256SUMS-agent.txt
