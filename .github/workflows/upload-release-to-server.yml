name: Upload Release to Server

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload, for example v0.81.01
        required: true
        default: v0.81.01

jobs:
  upload:
    name: Upload existing GitHub Release assets to ptang
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # 生产服务器信息只允许来自 secrets——不设任何 fallback，避免仓库
      # 泄漏部署目标；缺 secret 时直接 fail（见下方 guard step）。
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard required deploy secrets
        run: |
          missing=0
          for v in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_DIR DEPLOY_KEY; do
            if [ -z "${!v}" ]; then echo "::error::secret $v is not configured"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Download Release assets inside GitHub runner
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
          ls -lh release-assets

      - name: Write checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS-github-release.txt

      - name: Upload to ptang
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          shopt -s nullglob
          files=(release-assets/*)
          bash .github/scripts/upload-release-assets.sh "$version" "${files[@]}"
