# golangci-lint 配置（收紧阻断门禁）。
run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

linters-settings:
  errcheck:
    # 这些方法的返回值按惯例忽略（HTTP 响应写入/刷新、流关闭、标准输出打印）。
    exclude-functions:
      - (net/http.ResponseWriter).Write
      - (net/http.ResponseWriter).Flush
      - (net/http.ResponseWriter).Header
      - (io.Closer).Close
      - (io.StringWriter).WriteString
      - fmt.Fprint
      - fmt.Fprintf
      - fmt.Fprintln

issues:
  exclude-rules:
    # 测试代码的 setup/断言调用常忽略错误返回（如 op.Create / w.Write），不阻断。
    - path: _test\.go
      linters:
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0
