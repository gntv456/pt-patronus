# animetosho — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: 。selectors/user_info 若未列出则由 EnsureDefaults 自填校准默认。
# calibration: pending — 以下字段含 elementProcess/case/匿名函数，需人工翻译：
#   - search.seeders（text）
#   - search.seeders.filters（匿名函数）
#   - search.leechers（text）
#   - search.leechers.filters（匿名函数）
#   - search.time.filters（匿名函数）
#   - search.category（text）

aka:
    - AT
    - アニメ等所
description: AnimeTosho (AT) is an automated service that provides torrent files, magnet links and DDL for all anime releases
id: animetosho
name: AnimeTosho
search_entry: /search
search_param: q
selectors:
    fields:
        category: {}
        detail:
            attr: href
            selector: div.link a
        download:
            attr: href
            selectors:
                - div.links > a[href$=".torrent"]
                - div.links > a[href^="magnet:?xt="]
        leechers:
            attr: title
            selector: span[title*="Leechers"]
        seeders:
            attr: title
            selector: span[title*="Seeders"]
        size:
            selector: div.size
        time:
            attr: title
            filters:
                - args: '[dd/MM/yyyy HH:mm]'
                  name: parse_time
            selector: div.date
        title:
            selector: div.link a
    rows:
        selector: div.home_list_entry
tags:
    - 动画
    - 漫画
urls:
    - https://animetosho.org/
