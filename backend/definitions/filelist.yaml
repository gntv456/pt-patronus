id: filelist
legacy_urls:
    - https://flro.org/
level_requirements:
    - name: User
      privilege: This status is obtained by the new user of this tracker.
    - id: 1
      interval: P4W
      name: Power User
      privilege: It can download DOX files larger than 1MB. This class has the right to apply to uploader status.
      ratio: 1.05
      uploaded: 25GB
    - id: 2
      interval: P6M
      name: Addict
      privilege: This class has the right to request a Custom Title. This class is entitled to requests.
      ratio: 4
      uploaded: 500GB
    - id: 3
      interval: P4Y
      name: Elite
      privilege: This class gives you the right to give reputation to other users.
      ratio: 5
      uploaded: 4TB
    - group_type: vip
      id: 4
      name: VIP
      privilege: This class always has a minimum ratio equal to 2, regardless of the downloads made, and is exempt from hit&run rules. They can set their own Custom Title.
name: FileList
schema: filelist
search_entry: /browse.php
search_param: search
selectors:
    fields:
        category:
            attr: alt
            selectors:
                - div:nth-child(1) img[alt]
        completed:
            selector: div:nth-child(8)
        detail:
            filters:
                - args: id
                  name: queryparam
        download: {}
        leechers:
            selector: div:nth-child(10)
        seeders:
            selector: div:nth-child(9)
        size:
            filters:
                - name: parse_size
            selector: div:nth-child(7)
        subtitle: {}
        time:
            selector: div:nth-child(6)
        title:
            attr: title
            selectors:
                - a[href*='details.php']:has(b)
    rows:
        selector: .torrentrow
tags:
    - 影视
    - 综合
timezone_offset: "+0000"
urls:
    - https://filelist.io/
