      interval: P4W
      name: Power User
      privilege: 可以直接发布种子；可以查看NFO文档；可以查看用户列表；可以请求续种； 可以发送邀请； 可以查看排行榜；可以查看其它用户的种子历史(如果用户隐私等级未设置为"强")； 可以删除自己上传的字幕。
      ratio: 2
      seeding_bonus: 40000
    - downloaded: 100GB
      id: 2
      interval: P8W
      name: Elite User
      privilege: 没有新权限增加
      ratio: 2.5
      seeding_bonus: 80000
    - downloaded: 300GB
      id: 3
      interval: P15W
      name: Crazy User
      privilege: 可以在做种/下载/发布的时候选择匿名模式。
      ratio: 3
      seeding_bonus: 150000
    - downloaded: 500GB
      id: 4
      interval: P25W
      name: Insane User
      privilege: 可以查看普通日志。
      ratio: 3.5
      seeding_bonus: 250000
    - downloaded: 1TB
      id: 5
      interval: P40W
      name: Veteran User
      privilege: 可以查看其它用户的评论、帖子历史。
      ratio: 4
      seeding_bonus: 400000
    - downloaded: 2TB
      id: 6
      interval: P60W
      is_kept: true
      name: Extreme User
