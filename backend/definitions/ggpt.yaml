      ratio: 4.5
      seeding_bonus: 600000
    - downloaded: 5TB
      id: 7
      interval: P80W
      is_kept: true
      name: Ultimate User
      privilege: 这个等级会永远保留账号。
      ratio: 5
      seeding_bonus: 800000
    - downloaded: 10TB
      id: 8
      interval: P100W
      is_kept: true
      name: Nexus Master
      privilege: 这个等级会永远保留账号。
      ratio: 5.5
      seeding_bonus: 1000000
