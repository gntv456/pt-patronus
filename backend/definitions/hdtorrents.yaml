# hdtorrents — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: xbtit。⚠ 本项目暂无该 schema 适配器，待 M3+ 实现。
# calibration: pending — 以下字段含 elementProcess/case/匿名函数，需人工翻译：
#   - search.category.filters（匿名函数）
#   - userInfo.process（多步抓取流程，需适配器实现）

aka:
    - HDT
description: HD-Torrents is a private tracker for HD content.
id: hdtorrents
level_requirements:
    - id: 1
      name: HD Newbie
      privilege: Can access "Index", "Torrents", "Donate", "Requests", "Subtitles", "Forum"
    - id: 2
      name: HD Maniac
      privilege: Gain access to "Top 10"
      ratio: 1.05
      uploaded: 50GB
    - id: 3
      name: HD Monster
      privilege: Gain access to "Tracker Info", "Invites" section of the forums
      ratio: 2
      uploaded: 250GB
    - id: 4
      name: HD Daemon
      privilege: Gain access to "Users"
      ratio: 4
      uploaded: 1TB
name: HD-Torrents
schema: xbtit
search_entry: /torrents.php
selectors:
    fields:
        category:
            attr: href
            selector: a[href^='torrents.php?category=']
        completed:
            selector: td:nth-last-child(1)
        detail:
            attr: href
            selector: a[href^='details.php?id=']
        download:
            attr: href
            selector: a[href^='download.php?id=']
        leechers:
            selector: td:nth-last-child(2)
        seeders:
            selector: td:nth-last-child(3)
        size:
            selector: td:nth-child(8)
        subtitle:
            selector: td:nth-child(3) span
        time:
            filters:
                - args: '[HH:mm:sss  dd/MM/yyyy]'
                  name: parse_time
            selector: td:nth-child(7)
        title:
            selector: a[href^='details.php?id=']
    rows:
        selector: table.mainblockcontenttt > tbody > tr:has(td.mainblockcontent):not(:first-of-type)
tags:
    - 影视
    - 综合
timezone_offset: "+0000"
urls:
    - https://hd-torrents.org/
    - https://hd-torrents.net/
    - https://hd-torrents.me/
    - https://hdts.ru/
