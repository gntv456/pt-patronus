# hdupt — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: nexusphp。selectors/user_info 若未列出则由 EnsureDefaults 自填校准默认。
# calibration: pending — 以下字段含 elementProcess/case/匿名函数，需人工翻译：
#   - userInfo.seeding（elementProcess）

aka:
    - 好多油
categories:
    - id: "401"
      name: Movies/电影
    - id: "402"
      name: TV Series/电视剧
    - id: "403"
      name: TV Shows/综艺
    - id: "404"
      name: Documentaries/纪录片
    - id: "405"
      name: Animations/动画
    - id: "406"
      name: Music Videos/音乐 MV
    - id: "407"
      name: Sports/体育
    - id: "408"
      name: HQ Audio/无损音乐
    - id: "411"
      name: Misc/其他
    - id: "410"
      name: Games/游戏
description: 这是一个尊重版权的私有资源PT分享站点HDU。高清有你，你有UPXIN
id: hdupt
level_requirements:
    - id: 1
      name: User
      privilege: 新用户的默认级别。
    - downloaded: 50GB
      id: 2
      interval: P4W
      name: Power User
      name_aka:
        - 初窥门径
      privilege: |-
        map[__raw:BinaryExpression src:"可以直接发布种子；可以查看NFO文档；可以查看用户列表；可以请求续种； 可以发送邀请；" +
                '可以查看其它用户的种子历史(如果用户隐私等级未设置为"强")； 可以删除自己上传的字幕。']
      ratio: 2
    - downloaded: 120GB
      id: 3
      interval: P8W
      name: Elite User
      name_aka:
        - 略有小成
      privilege: 略有小成(Elite User)及以上用户封存账号后不会被删除，可以进入论坛邀请区。
      ratio: 2.5
    - downloaded: 300GB
      id: 4
      interval: P15W
      name: Crazy User
      name_aka:
        - 驾轻就熟
      privilege: 得到一个邀请名额。
      ratio: 3
    - downloaded: 500GB
      id: 5
      interval: P25W
      name: Insane User
      name_aka:
        - 渐入佳境
      privilege: 得到一个邀请名额。
      ratio: 3.85
    - downloaded: 750GB
      id: 6
      interval: P40W
      is_kept: true
      name: Veteran User
      name_aka:
        - 炉火纯青
      privilege: 得到一个邀请名额；可以查看其它用户的评论、帖子历史。炉火纯青(Veteran User)及以上用户会永远保留账号。
      ratio: 5.95
    - downloaded: 1TB
      id: 7
      interval: P60W
      is_kept: true
      name: Extreme User
      name_aka:
        - 登峰造极
      privilege: 得到一个邀请名额；可以更新过期的外部信息；可以查看Extreme User论坛。
      ratio: 6.55
    - downloaded: 1.5TB
      id: 8
      interval: P80W
      is_kept: true
      name: Ultimate User
      name_aka:
        - 举世无双
      privilege: 得到两个邀请名额。
      ratio: 7.05
    - downloaded: 3TB
      id: 9
      interval: P100W
      is_kept: true
      name: Nexus Master
      name_aka:
        - 超凡入圣
      privilege: 得到三个邀请名额。
      ratio: 8.85
name: HDU
schema: nexusphp
tags:
    - 影视
    - 综合
urls:
    - https://pt.hdupt.com/
    - https://pt.upxin.net/
user_info:
    fields:
        bonus:
            filters:
                - name: parse_number
            selectors:
                - td.rowhead:contains('魔力值') + td
        seeding:
            selectors:
                - img.arrowup
        seeding_size:
            filters:
                - name: parse_size
            selectors:
                - td.rowhead:contains('Seeding Size') + td
