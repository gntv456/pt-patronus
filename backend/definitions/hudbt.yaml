description: HUDBT,教育网高速IPv6BT下载站。
id: hudbt
level_requirements:
    - id: 1
      name: User
      privilege: 新用户的默认级别。
    - downloaded: 50GB
      id: 2
      interval: P4W
      name: Power User
      name_aka:
        - 易形
      privilege: |-
        map[__raw:BinaryExpression src:"得到一个邀请名额；可以直接发布种子；可以查看NFO文档；可以查看用户列表；可以请求续种； " +
                '可以查看排行榜；可以查看其它用户的种子历史(如果用户隐私等级未设置为"强")； 可以删除自己上传的字幕。']
      ratio: 1.05
    - downloaded: 120GB
      id: 3
      interval: P9W
      name: Elite User
      name_aka:
        - 化蛹
      privilege: 化蛹(Elite User)及以上用户封存账号后不会被删除。
      ratio: 1.55
    - downloaded: 300GB
      id: 4
      interval: P16W
      name: Crazy User
      name_aka:
        - 破茧
      privilege: |-
        map[__raw:BinaryExpression src:"得到一个邀请名额； 可以发送邀请（注意：网站会视情况提高或者降低允许发送邀请的最低等级，此处不一定会及时修改）；" +
                "可以在做种/下载/发布的时候选择匿名模式。"]
      ratio: 2.05
    - downloaded: 500GB
      id: 5
      interval: P25W
      name: Insane User
      name_aka:
        - 恋风
      privilege: 可以查看普通日志。
      ratio: 2.55
    - downloaded: 750GB
      id: 6
      interval: P36W
      is_kept: true
      name: Veteran User
      name_aka:
        - 翩跹
      privilege: 得到一个邀请名额；可以查看其它用户的评论、帖子历史。翩跹(Veteran User)及以上用户会永远保留账号。
      ratio: 3.05
    - downloaded: 1TB
      id: 7
      interval: P49W
      is_kept: true
      name: Extreme User
      name_aka:
        - 归尘
      privilege: 可以更新过期的外部信息；可以查看Extreme User论坛。（未启用）
      ratio: 3.55
    - downloaded: 1.5TB
      id: 8
      interval: P64W
      is_kept: true
      name: Ultimate User
      name_aka:
        - 幻梦
      ratio: 4.05
    - downloaded: 3TB
      id: 9
      interval: P81W
      is_kept: true
      name: Nexus Master
      name_aka:
        - 逍遥
      ratio: 4.55
name: 蝴蝶-HUDBT
schema: nexusphp
selectors:
    fields:
        subtitle:
            selector: div.torrent-title > h3
