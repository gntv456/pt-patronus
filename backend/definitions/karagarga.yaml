# karagarga — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: 。selectors/user_info 若未列出则由 EnsureDefaults 自填校准默认。
# calibration: pending — 以下字段含 elementProcess/case/匿名函数，需人工翻译：
#   - search.category.filters（匿名函数）
#   - search.subTitle（elementProcess）
#   - userInfo.process（多步抓取流程，需适配器实现）

aka:
    - KG
description: KaraGarga is a private tracker for non-mainstream movies, music and literature.
id: karagarga
level_requirements:
    - id: 1
      interval: P13W
      name: Power User
      ratio: 1.05
      uploaded: 50GB
name: KaraGarga
no_login:
    selector: form[action='takelogin.php']
search_entry: /browse.php
search_param: search
selectors:
    fields:
        category:
            attr: title
            selector: a[href^="browse.php?genre="] img
        completed:
            filters:
                - name: parse_number
            selector: td:nth-child(12)
        detail:
            attr: href
            selector: a[href^="details.php?id="]
        download:
            attr: href
            selector: a[href^="/down.php/"]
        leechers:
            filters:
                - name: parse_number
            selector: td:nth-child(14)
        seeders:
            filters:
                - name: parse_number
            selector: td:nth-child(13)
        size:
            filters:
                - name: parse_size
            selector: td:nth-child(11)
        subtitle:
            selector: :self
        time:
            selector: td:nth-child(9)
        title:
            selector: a[href^="details.php?id="] > b
    rows:
        selector: table#browse > tbody > tr:has(a[href^="details.php?id="])
tags:
    - 电影
    - 音乐
    - 文学
timezone_offset: "+0000"
urls:
    - https://karagarga.in/
