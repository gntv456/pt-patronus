description: 汇聚每一个人的影响力，让音乐流行起来吧！
id: musopia
level_requirements:
    - id: 1
      name: Peasant
      privilege: 被降级的用户，他们有30天时间来提升分享率，否则他们会被踢。不能申请友情链接；不能上传字幕。
    - id: 2
      name: User
      privilege: 新用户的默认级别。可以发送邀请；可匿名发布; 可对候选投反对票; 可购买邀请。
    - downloaded: 50GB
      id: 3
      interval: P4W
      name: Power User
      privilege: 可以请求续种；可使用个性条。分享率低于0.95，你将自动降级。
      ratio: 1.05
      seeding_bonus: 40000
    - downloaded: 120GB
      id: 4
      interval: P8W
      name: Elite User
      privilege: Elite User及以上用户封存账号后不会被删除。分享率低于1.45，你将自动降级。
      ratio: 1.55
      seeding_bonus: 80000
    - downloaded: 300GB
      id: 5
      interval: P15W
      name: Crazy User
      privilege: 可以查看用户列表；可以查看其它用户的种子历史(如果用户隐私等级未设置为强)。分享率低于1.95，你将自动降级。
      ratio: 2.05
      seeding_bonus: 150000
    - downloaded: 500GB
      id: 6
      interval: P25W
      name: Insane User
      privilege: 可以查看普通日志。分享率低于2.45，你将自动降级。
      ratio: 2.55
      seeding_bonus: 250000
    - downloaded: 750GB
      id: 7
      interval: P40W
      name: Veteran User
      privilege: 可以查看其它用户的评论、帖子历史。Veteran User及以上用户会永远保留账号。分享率低于2.95，你将自动降级。
      ratio: 3.05
      seeding_bonus: 400000
    - downloaded: 1024GB
      id: 8
      interval: P60W
      name: Extreme User
      privilege: 可以更新过期的外部信息；可以查看Extreme User论坛。分享率低于3.45，你将自动降级。
      ratio: 3.55
      seeding_bonus: 600000
    - downloaded: 1536GB
      id: 9
      interval: P80W
      name: Ultimate User
      privilege: 同上。分享率低于3.95，你将自动降级。
      ratio: 4.05
      seeding_bonus: 800000
    - downloaded: 3072GB
      id: 10
      interval: P100W
      name: Nexus Master
      privilege: 同上。分享率低于4.45，你将自动降级。
      ratio: 4.55
      seeding_bonus: 1000000
    - group_type: vip
      id: 100
      name: 贵宾(VIP)
      privilege: 和Nexus Master拥有相同权限并被认为是精英成员。免除自动降级。
    - group_type: manager
      id: 200
      name: 养老族(Retiree)
      privilege: 退休后的管理组成员。
    - group_type: manager
      id: 201
      name: 发布员(Uploader)
      privilege: 专注的发布者。免除自动降级；可以查看匿名用户的真实身份。
    - group_type: manager
      id: 202
      name: 总版主(Moderator)
      privilege: 可以查看管理组信箱、举报信箱；管理趣味盒内容、投票内容；可以编辑或删除任何发布的种子；可以管理候选；可以管理论坛帖子、用户评论；可以查看机密日志；可以删除任何字幕；可以管理日志中的代码、史册；可以查看用户的邀请记录；可以管理用户帐号的一般信息。不能管理友情链接、最近消息、论坛版块；不能将种子设为置顶或促销；不能查看用户IP或Email等机密信息；不能删除账号。
    - group_type: manager
      id: 203
      name: 管理员(Administrator)
      privilege: 除了不能改变站点设定、管理捐赠外，可以做任何事。
    - group_type: manager
      id: 204
      name: 维护开发员(Sysop)
      privilege: 网站开发/维护人员，可以改变站点设定，不能管理捐赠。
    - group_type: manager
      id: 205
      name: 主管(Staff Leader)
      privilege: 网站主管，可以做任何事。
name: 音乐乌托邦
schema: nexusphp
tags:
    - 音乐
timezone_offset: "+0800"
urls:
    - https://www.musopia.vip/
    - https://pt.xzt.me/
user_info:
    fields:
        bonus:
            filters:
                - name: parse_number
            selectors:
                - td.rowhead:contains('魔力值') + td
                - td.rowhead:contains('Karma'):contains('Points') + td
