description: 网站由西安交通大学学生自主创建与管理，汇集学习资料、纪录片、电影、剧集等各类优质资源
id: nanyangpt
level_requirements:
    - id: 1
      name: 本科新生
      privilege: 新用户的默认级别。
    - downloaded: 30GB
      id: 2
      interval: P2W
      name: 小小学士
      privilege: |-
        map[__raw:BinaryExpression src:"可以直接发布种子；可以查看NFO文档；可以查看用户列表；" +
                '可以请求续种；可以查看其它用户的种子历史(如果用户隐私等级未设置为"强")； 可以删除自己上传的字幕。']
      ratio: 1.5
    - downloaded: 50GB
      id: 3
      interval: P5W
      name: 优秀硕士
      privilege: 优秀硕士及以上用户封存账号后不会被删除。
      ratio: 2.5
    - downloaded: 100GB
      id: 4
      interval: P10W
      name: 初为博士
      privilege: 可以在做种/下载/发布的时候选择匿名模式，可以在邀请传送门版块发帖。
      ratio: 3.5
    - downloaded: 300GB
      id: 5
      interval: P15W
      name: 海归博后
      privilege: 可以查看普通日志。
      ratio: 4.5
    - downloaded: 500GB
      id: 6
      interval: P20W
      is_kept: true
      name: 大学讲师
      privilege: 可以查看排行榜；可以查看其它用户的评论、帖子历史。大学讲师及以上用户会永远保留账号。
      ratio: 5.5
    - downloaded: 700GB
      id: 7
      interval: P30W
      is_kept: true
      name: 晋升副教
      privilege: 可以更新过期的外部信息；可以查看晋升副教论坛。
      ratio: 6.5
    - downloaded: 900GB
      id: 8
      interval: P80W
      is_kept: true
      name: 终身教授
      privilege: 更加高级。
      ratio: 7.5
    - downloaded: 1TB
      id: 9
      interval: P100W
      is_kept: true
      name: 荣誉院士
      privilege: 更加高级。
      ratio: 8.5
    - group_type: vip
      id: 100
      name: 贵宾
      privilege: 和荣誉院士拥有相同权限并被认为是精英成员。免除自动降级。
    - group_type: manager
      id: 200
      name: 养老族
      privilege: 退休后的管理组成员。
    - group_type: manager
      id: 201
      name: 论坛版主
      privilege: 论坛版块的版主，拥有管理版块的权限，免除自动降级。
    - group_type: manager
      id: 202
      name: 保种分流员
      privilege: 保种分流员，免除自动降级。
    - group_type: manager
      id: 203
      name: 发布员
      privilege: 专注的发布者，免除自动降级；可以查看匿名用户的真实身份。
    - group_type: manager
      id: 204
      name: 种子管理员
      privilege: |-
        map[__raw:BinaryExpression src:"可以查看管理组信箱、举报信箱；管理趣味盒内容、投票内容；可以编辑或删除任何发布的种子；可以管理候选；" +
                "可以管理论坛帖子、用户评论；可以查看机密日志；可以删除任何字幕；可以管理日志中的代码、史册；" +
                "可以查看用户的邀请记录；可以管理用户帐号的一般信息。不能管理友情链接、最近消息、论坛版块；" +
                "不能将种子设为置顶或促销；不能查看用户]
    - group_type: manager
      id: 205
      name: 高级管理员
      privilege: 除了不能改变站点设定、管理捐赠外，可以做任何事。
    - group_type: manager
      id: 206
      name: 维护开发员
      privilege: 网站开发/维护人员，可以改变站点设定，不能管理捐赠。
    - group_type: manager
      id: 207
      name: 主管
      privilege: 网站主管，可以做任何事。
name: 南洋PT
schema: nexusphp
tags:
