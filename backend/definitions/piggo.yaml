# 猪猪（piggo.me）站点定义 —— 自研引擎（schema: piggo）
#
# 站点已从 NexusPHP 整体改版为 Laravel + Vite SPA 自研引擎（2026-11 验证），
# 旧刮削选择器全部作废；现由 backend/internal/site/schemas/piggo.go 代码适配
# /v1/web JSON API——本 YAML 不配置 selectors。
#
# 鉴权（站点无 Cookie/passkey 通道，只有账号密码）：
#   1. 站点凭据填「用户名 + 密码」——适配器自动走 SRP-6a 加密登录
#      （RFC5054 2048-bit 群 + PBKDF2 21 万轮派生，密码不以明文进请求体）
#   2. 登录后 token 与设备指纹 visitorId 绑定，全部请求带 HMAC-SHA256 签名
#      （X-Spa-Nonce/X-Spa-Hmac，sign 每会话由 /auth/sign 下发）——适配器内部处理
#   3. 会话缓存在进程内存（12h 刷新；401 自动重登）
#
# ⚠ 新账号首次使用须在网页端完成一次「Wiki 已读确认」（/wiki/rules-general
#   页点「确认已阅读」），否则种子端点全部 403 wiki_unread（站点强制闸门）。
#
# 改版口径（2026-11 逆向，站内 API 文档 + SPA chunks）：
#   搜索   GET /v1/web/torrents?q=&section=&page=&per_page=（keyword→q，
#          /torrents/movie 路由→section 参数；条目含 media/tags 字段）
#   促销   条目 promotion{id:2-7,label,promotion_until}（2=免费 3=2x上传
#          4=2x免费 5=50% 6=2x50% 7=30%）；兼容旧 label 文本
#   站免   /v1/web/me 顶层 global_promotion{phase:none|preview|active,
#          title,label,ends_at}（适配器 FetchFreeleech 已实现）
#   详情   GET /v1/web/torrents/{id}（同列表字段 + page_url/tag_ids）
#   下载   POST /v1/web/torrents/{id}/download-link → 24h 签名直链
#   资料   GET /v1/web/me（stats.uploaded 格式化串；notice_gate/wiki_gate 闸门）
#
# 登录链路改版未变：SRP-6a challenge→login + 失败回退明文 /login；
# 多次失败会触发站点人机验证（turnstile/aliyun，浏览器内完成），适配器侧
# 遇「请填写验证码」报错即需网页登录一次解锁。
id: piggo
name: 猪猪
schema: piggo
urls:
  - https://piggo.me
# 公告：改版无 REST 公告端点（仅 banners 横幅位 + WS notice 事件），关闭；
# 站免：global_promotion 走适配器 FetchFreeleech（/v1/web/me）。
# 单种促销由搜索结果 promotion{id} 正常下发，不受影响。
announcement:
  enabled: false
freeleech:
  enabled: true
