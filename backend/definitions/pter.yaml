schema: nexusphp
selectors:
    fields:
        subtitle:
            selectors:
                - div > span:eq(0)
        title:
            selectors:
                - a[href*='details.php?id='][title]
                - a[href*='detailsgame.php?id='][title]
                - a[href^="details.php?id="]
                - a[href^="detailsgame.php?"]
tags:
    - 影视
    - 综合
urls:
    - https://pterclub.net/
user_info:
    fields:
        bonus:
            filters:
                - name: parse_number
            selectors:
                - td.rowhead:contains('猫粮') + td, td.rowhead:contains('Karma Points') + td, td.rowhead:contains('貓糧') + td
        seeding:
            filters:
                - name: parse_number
            selectors:
                - '#info_block a[href*=''getusertorrentlist.php''][href*=''type=seeding'']'
        seeding_size:
            filters:
                - name: parse_size
            selectors:
                - td.rowhead:contains('做种大小') + td, td.rowhead:contains('Seeding Size') + td, td.rowhead:contains('做種大小') + td
