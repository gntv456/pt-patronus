# rousipro — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: rousi。Rousi Pro API 由 backend/internal/site/schemas/rousi.go 适配。
# 搜索/用户资料 API 已按 PT-depiler + MoviePilot 契约实现；真站 live_smoke 仍建议定期跑。

aka:
    - Rousi
    - 肉丝
id: rousipro
name: Rousi Pro
schema: rousi
search_entry: /api/v1/search
search_param: keyword
selectors:
    fields:
        category:
            selector: category_name
        completed:
            selector: downloads
        detail:
            selector: uuid
        leechers:
            selector: leechers
        seeders:
            selector: seeders
        size:
            selector: size
        subtitle:
            selector: subtitle
        time:
            filters:
                - name: parse_time
            selector: created_at
        title:
            selector: title
    rows:
        selector: data.torrents
urls:
    - https://rousi.pro/
