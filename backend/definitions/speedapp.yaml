description: SpeedApp is a ROMANIAN Private Torrent Tracker for MOVIES / TV / GENERAL
id: speedapp
legacy_urls:
    - https://icetorrent.org/
    - https://scenefz.me/
    - https://u-torrents.ro/
    - https://myxz.eu/
level_requirements:
    - id: 1
      name: Peasant
      name_aka:
        - 农民
    - id: 2
      interval: P30D
      name: User
      name_aka:
        - 用户
      privilege: Can invite other people.
      ratio: 1.05
      uploaded: 25GB
    - id: 3
      interval: P90D
      name: Power User
      name_aka:
        - 超级用户
      privilege: Can make requests.
      ratio: 2
      uploaded: 200GB
    - id: 4
      interval: P180D
      name: Elite User
      name_aka:
        - 精英用户
      privilege: Can be chosen as Hyperseeders (immune to HnR).
      ratio: 3
      uploaded: 1TB
    - id: 5
      interval: P12M
      name: Xtreme User
      name_aka:
        - 极端用户
      privilege: Same privileges as Elite User.
      ratio: 4
      uploaded: 5TB
    - id: 6
      interval: P2Y
      name: Super User
      name_aka:
        - 超级用户
      privilege: Same privileges as Elite User.
      ratio: 5
      uploaded: 20TB
    - id: 7
      interval: P6Y
      name: Legend User
      name_aka:
        - 传奇用户
      privilege: Same privileges as Elite User.
      ratio: 6
      uploaded: 100TB
    - group_type: vip
      id: 8
      name: VIP
      name_aka:
        - 贵宾
      privilege: Same privileges as Elite User, immune to automated HnR warnings.
name: SpeedApp
search_entry: /browse
search_param: search
selectors:
    fields:
        category:
            attr: href
            selector: a[href*='?categories']
        completed:
            filters:
                - name: parse_number
            selector: div:nth-child(3)
        detail:
            attr: href
            selector: div:nth-child(2) > a[href^='/browse/']:first-child
        download:
            attr: href
            selector: a.btn[href^='/torrents/']
        leechers:
            filters:
                - name: parse_number
            selector: span.text-danger
        seeders:
            filters:
                - name: parse_number
            selector: span.text-success
        size:
            filters:
                - name: parse_size
            selector: div:nth-child(4)
        time:
            attr: title
            filters:
                - args: '[map[__regex:/日/g]  ]'
                  name: replace
                - args: '[map[__regex:/[年月]/g] -]'
                  name: replace
                - name: parse_time
            selector: div:nth-child(2)
        title:
            selector: div:nth-child(2) > a[href^='/browse/']:first-child
    rows:
        selector: div.row.mr-0.ml-0.py-3
tags:
    - 影视
    - 综合
timezone_offset: "+0300"
urls:
    - https://speedapp.io/
