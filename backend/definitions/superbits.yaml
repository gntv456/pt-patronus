# superbits — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: rartracker。⚠ 本项目暂无该 schema 适配器，待 M3+ 实现。
# calibration: pending — 以下字段含 elementProcess/case/匿名函数，需人工翻译：
#   - userInfo.process（多步抓取流程，需适配器实现）

description: Sveriges största bittorrent tracker.
id: superbits
level_requirements:
    - name: map[__raw:ElementAccessExpression src:levelIdMap[0]]
      privilege: 新用户的默认等级。
    - id: 1
      interval: P14D
      name: map[__raw:ElementAccessExpression src:levelIdMap[1]]
      privilege: 可以创建和上传 requests，使用积分系统及站点其他功能。
      ratio: 1.05
      uploaded: 50GiB
    - id: 2
      interval: P15W
      name: map[__raw:ElementAccessExpression src:levelIdMap[2]]
      privilege: 访问所有排行榜，使用邀请系统。IP 日志被清除且关闭 IP 记录。可在 P2P 和 Arkiv 上传种子。
      ratio: 1.1
      uploaded: 300GiB
    - id: 3
      interval: P30W
      name: map[__raw:ElementAccessExpression src:levelIdMap[3]]
      privilege: 可以查看 Veteran 论坛。
      ratio: 1.1
      uploaded: 1.2TiB
    - id: 4
      interval: P3Y
      name: map[__raw:ElementAccessExpression src:levelIdMap[4]]
      privilege: 访问大部分功能。
      ratio: 2.1
      uploaded: 30TiB
name: Superbits
schema: rartracker
selectors:
    fields:
        completed:
            selector: timesCompleted
tags:
    - 综合
    - 影视
    - 瑞典
timezone_offset: "+0100"
urls:
    - https://superbits.org/
