# zhuque — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: tnode。⚠ 本项目暂无该 schema 适配器，待 M3+ 实现。
# calibration: pending — 以下字段含 elementProcess/case/匿名函数，需人工翻译：
#   - search.category.filters（匿名函数）
#   - search.url.filters[prepend]
#   - search.time.filters（匿名函数）
#   - search.link.filters[prepend]
#   - userInfo.process（多步抓取流程，需适配器实现）

aka:
    - Zhuque
description: 新架构的影视站点
id: zhuque
level_requirements:
    - id: 1
      name: 筑基
      privilege: 入站初始等级
    - downloaded: 10GB
      id: 2
      interval: P5W
      name: 结丹
      privilege: 无
      ratio: 2
    - downloaded: 25GB
      id: 3
      interval: P10W
      name: 元婴
      privilege: 无
      ratio: 2
    - downloaded: 50GB
      id: 4
      interval: P15W
      name: 出窍
      privilege: 无
      ratio: 2
    - downloaded: 100GB
      id: 5
      interval: P20W
      name: 炼虚
      privilege: 无
      ratio: 2
    - downloaded: 200GB
      id: 6
      interval: P25W
      name: 合体
      privilege: 无
      ratio: 4
    - downloaded: 300GB
      id: 7
      interval: P30W
      name: 大乘
      privilege: 无
      ratio: 6
    - downloaded: 400GB
      id: 8
      interval: P35W
      name: 真仙
      privilege: 无
      ratio: 8
name: 朱雀
schema: tnode
search_entry: /api/torrent/advancedSearch
search_param: keyword
selectors:
    fields:
        category:
            selector: category
        completed:
            selector: complete
        detail:
            selector: id
        download:
            selector: id
        leechers:
            selector: leeching
        seeders:
            selector: seeding
        size:
            selector: size
        subtitle:
            selector: subtitle
        time:
            selector: upload_time
        title:
            selector: title
    rows:
        selector: data.torrents
tags:
    - 影视
    - 综合
timezone_offset: "+0800"
urls:
    - https://zhuque.in/
