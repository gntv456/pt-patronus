#   - search.subTitle（elementProcess）

aka:
    - 末日种子库
description: Arctic Global Seed Vault
id: agsvpt
level_requirements:
    - name: User
      privilege: 新用户的默认级别。只能在每周六中午12点至每周日晚上11点59分发布种子。
    - downloaded: 50GB
      id: 1
      name: Power User
      name_aka:
        - 北冰珍珠熊
      privilege: 可以进入银行贷款
      ratio: 1.05
      seeding_bonus: 40000
    - downloaded: 120GB
      id: 2
      interval: P8W
      name: Elite User
      name_aka:
        - 深渊蔚蓝熊
      privilege: '可以得到一个邀请名额；Elite User及以上用户封存账号后不会被删除。  '
      ratio: 1.55
      seeding_bonus: 80000
    - downloaded: 300GB
      id: 3
      interval: P12W
      name: Crazy User
      name_aka:
        - 翡翠森林熊
      privilege: 可以在做种/下载/发布的时候选择匿名模式。
      ratio: 2.05
      seeding_bonus: 150000
    - downloaded: 500GB
      id: 4
      interval: P20W
      name: Insane User
      name_aka:
        - 神秘紫晶熊
      privilege: 查看普通日志
      ratio: 2.55
      seeding_bonus: 400000
    - downloaded: 750GB
      id: 5
      interval: P28W
      is_kept: true
      name: Veteran User
      name_aka:
        - 寒冰白金熊
      privilege: 永远保留账号；查看其它用户的评论、帖子历史
      ratio: 4.05
      seeding_bonus: 800000
    - downloaded: 1TB
      id: 6
      interval: P40W
      is_kept: true
      name: Extreme User
      name_aka:
        - 皇家金辉熊
      privilege: '可以更新过期的外部信息；可以查看Extreme User论坛。  '
      ratio: 5.05
      seeding_bonus: 1400000
    - downloaded: 1.5TB
      id: 7
      interval: P52W
      is_kept: true
      name: Ultimate User
      name_aka:
        - 永恒铂金熊
      privilege: 首次升级至此等级的用户将获得2个邀请名额。
      ratio: 6.05
      seeding_bonus: 2200000
    - downloaded: 3TB
      id: 8
      interval: P70W
      is_kept: true
      name: Nexus Master
      name_aka:
        - 钻石之冠北极熊
      privilege: 首次升级至此等级的用户将获得2个邀请名额。
      ratio: 7.05
      seeding_bonus: 3200000
name: AGSVPT
schema: nexusphp
selectors:
    fields:
        subtitle:
            selectors:
                - div.torrent_title_desc
tags:
    - 综合
    - 短剧
    - 影视
timezone_offset: "+0800"
urls:
    - https://pt.agsvpt.cn/
    - https://www.agsvpt.com/
    - https://new.agsvpt.cn/
user_info:
    fields:
        bonus:
            filters:
                - name: parse_number
            selectors:
                - td.rowhead:contains('冰晶') + td, td.rowhead:contains('Karma Points') + td
