# aidoruonline — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: aidoruonline。⚠ 本项目暂无该 schema 适配器，待 M3+ 实现。
# calibration: pending — 以下字段含 elementProcess/case/匿名函数，需人工翻译：
#   - search.category.filters（匿名函数）
#   - search.time.filters（匿名函数）
#   - userInfo.ratio.filters（匿名函数）
#   - userInfo.bonus（text）
#   - userInfo.seedingSize（elementProcess）
#   - userInfo.id.filters（匿名函数）

id: aidoruonline
level_requirements:
    - id: 1
      name: Member
      privilege: Can download, upload torrents；Ratio effects availability of new torrents
    - id: 2
      interval: P6M
      name: 'Sharer '
      privilege: Can download, upload torrents；Ratio has no effect on availability of new torrents；Notification and highlighting of new comments
      uploads: 50
    - id: 3
      name: Distributor
      privilege: Can download, upload torrents；Ratio has no effect on availability of new torrents；Notification and highlighting of new comments；Can view peers on torrents；Can view user list of who completed downloading a torrent
      ratio: 1
      uploads: 500
    - id: 4
      name: Uploader
      privilege: user who uploads new content to the site on a regular basis
    - id: 5
      name: Uploader+
      privilege: uploader who has a low freeleech ratio
name: Aidoru!Online
schema: aidoruonline
search_entry: /get_ttable.php
search_param: searchstr
selectors:
    fields:
        category:
            selectors:
                - a.category-link
        completed:
            filters:
                - name: parse_number
            selectors:
                - font[color='black'] > b
        detail:
            attr: href
            selectors:
                - a[href*='torrents-details.php?id=']:not([href*='#'])
        download:
            attr: href
            selectors:
                - a[href*='download.php?id=']
        leechers:
            filters:
                - name: parse_number
            selectors:
                - font[color='#ff0000'] > b
        seeders:
            filters:
                - name: parse_number
            selectors:
                - font[color='green'] > b
        size:
            filters:
                - name: parse_size
            selectors:
                - td.ttable_size
        time:
            selectors:
                - td.ttable_timestamp
        title:
            selectors:
                - a[href*='torrents-details.php?id=']:not([href*='#']) b
    rows:
        selector: tr.t-row
tags:
    - 偶像
urls:
    - https://aidoru-online.me/
user_info:
    fields:
        bonus: {}
        downloaded:
            filters:
                - name: parse_size
            selectors:
                - td.prof-lbl:contains('Downloaded:') + td
        id:
            attr: href
            selectors:
                - a[href*='member.php?action=profile']
        join_date:
            filters:
                - name: parse_time
            selectors:
                - td.prof-lbl:contains('Joined:') + td
        level:
            selectors:
                - td.prof-lbl:contains('User Class:') + td
        name:
            selectors:
                - td.prof-lbl:contains('Username:') + td
        ratio:
            selectors:
                - td.prof-lbl:contains('Ratio:') + td
        seeding:
            filters:
                - name: parse_number
            selectors:
                - span[id='seed-count']
        seeding_size:
            selector: :self
        uploaded:
            filters:
                - name: parse_size
            selectors:
                - td.prof-lbl:contains('Uploaded:') + td
        uploads:
            filters:
                - name: parse_number
            selectors:
                - td.prof-lbl:contains('Uploads:') + td
