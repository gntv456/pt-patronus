# anthelion — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: gazelle。已由本项目运行时 schema adapter 支持。
# calibration: pending — 以下字段含 elementProcess/case/匿名函数，需人工翻译：
#   - search.category（text）
#   - search.category.filters（匿名函数）
#   - search.title（elementProcess）
#   - search.subTitle（switchFilters）
#   - userInfo.bonusPerHour.filters（匿名函数）
#   - userInfo.process（多步抓取流程，需适配器实现）

aka:
    - ANT
description: Anthelion (ANT) is a Private site for MOVIES
id: anthelion
level_requirements:
    - id: 1
      name: User
      privilege: Can download, upload, vote on requests, use advanced search, access top 10, and bookmark content.
    - bonus: 5000
      id: 2
      interval: P2W
      name: Member
      privilege: Create & manage collections; Send invites
      ratio: 0.8
      uploaded: 0.5TiB
    - bonus: 25000
      id: 3
      interval: P1M
      name: Power User
      privilege: Upload images; Access Top 10; Purchase Invites; Invite forums
      ratio: 1
      uploaded: 1TiB
    - bonus: 25000
      id: 4
      interval: P3M
      name: Fanatic
      privilege: Can have 1 personal collage; Receives periodic invites (max 1)
      ratio: 1
      uploaded: 1TiB
      uploads: 5
    - bonus: 250000
      id: 5
      interval: P6M
      name: Elite
      privilege: Can have a up to 2 personal collages; Can edit film descriptions/trailers; Receives periodic invites (max 2)
      ratio: 2.5
      uploaded: 5TiB
      uploads: 10
    - bonus: 500000
      id: 6
      interval: P1Y
      name: Guru
      privilege: Immune from being put on ratio watch; Receives periodic invites (max 4)
      ratio: 3
      uploaded: 5TiB
      uploads: 25
    - bonus: 1000000
      id: 7
      interval: P2Y
      name: Torrent Master
      privilege: Can have a up to 3 personal collages; Can edit torrents
      ratio: 3.5
      uploaded: 10TiB
      uploads: 50
name: Anthelion
schema: gazelle
search_entry: /torrents.php
selectors:
    fields:
        category:
            attr: class
            selector: div[class^='tooltip cats_']
        subtitle:
            selectors:
                - .tags
                - td:has(a[href*='torrents.php']) a:not(span a):last
        title: {}
tags:
    - 电影
timezone_offset: "+0000"
urls:
    - https://anthelion.me/
user_info:
    fields:
        bonus:
            filters:
                - args: '[map[__regex:/,/g] ]'
                  name: replace
            selector: a[href*='store.php']
        bonus_per_hour:
            selector: h3.float_right
        join_date:
            attr: title
            filters:
                - args: '[MMM d yyyy, HH:mm ''UTC'']'
                  name: parse_time
            selector: ul.stats li:contains('Joined:') span
        seeding:
            filters:
                - name: parse_number
            selector: response.seeding
        seeding_size:
            filters:
                - name: parse_size
            selector: 'li:contains(''Seeding Size: '') span'
