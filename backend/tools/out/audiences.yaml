name: Audiences
schema: nexusphp
selectors:
    fields:
        completed:
            filters:
                - name: parse_number
            selectors:
                - td:nth-of-type(8)
        detail:
            filters:
                - args: id
                  name: queryparam
        download: {}
        leechers:
            filters:
                - name: parse_number
            selectors:
                - td:nth-of-type(7)
        seeders:
            filters:
                - name: parse_number
            selectors:
                - td:nth-of-type(6)
        size:
            filters:
                - name: parse_size
            selectors:
                - td:nth-of-type(5)
        subtitle:
            selectors:
                - td.embedded:first > span:last
        time:
            selectors:
                - td:nth-of-type(4)
    rows:
        selectors:
            - table.torrents-table > tbody > tr[data-torrent-id]
tags:
    - 综合
    - 影视
    - 音乐
    - 电子书
    - 有声书
    - 体育
    - 游戏
timezone_offset: "+0800"
urls:
    - https://audiences.me/
user_info:
    fields:
        bonus:
            filters:
                - name: parse_number
            selectors:
                - .site-userbar__compact-metric--bonus
                - td.rowhead:contains('爆米花') + td
                - td.rowhead:contains('Karma Points') + td
        bonus_per_hour:
            selectors:
                - .mybonus-side__rate
        downloaded:
            selectors:
                - .site-userbar__compact-metric--downloaded
        join_date:
            selectors:
                - td:contains('加入日期：')
                - div:contains('加入日期：')
        leeching:
            filters:
                - name: parse_number
            selectors:
                - .site-userbar__compact-metric-inline-link--leeching
        level:
            attr: class
            filters:
                - args: '[_Name ]'
                  name: replace
            selectors:
                - div.ud-hero span.ud-class > b
        ratio:
            filters:
                - name: parse_number
            selectors:
                - .site-userbar__compact-metric--ratio
        seeding:
            filters:
                - name: parse_number
            selectors:
                - .site-userbar__compact-metric-inline-link--seeding
        uploaded:
            selectors:
                - .site-userbar__compact-metric--uploaded
