# audionews — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: 。selectors/user_info 若未列出则由 EnsureDefaults 自填校准默认。
# calibration: pending — 以下字段含 elementProcess/case/匿名函数，需人工翻译：
#   - search.category.filters（匿名函数）
#   - search.size（text）
#   - search.time（data）
#   - userInfo.process（多步抓取流程，需适配器实现）

aka:
    - AN
description: AudioNews (AN) is a Private Torrent Tracker for AUDIO SOFTWARE / SAMPLES / ETC
id: audionews
name: AudioNews
search_entry: /tracker.php
search_param: nm
selectors:
    fields:
        category:
            attr: href
            filters:
                - args: f
                  name: queryparam
            selector: td a[href*='/tracker.php?f=']
        completed:
            selector: td[title^='Replies:']
        detail:
            attr: href
            selector: td a[href*='/viewtopic.php?t=']
        download:
            attr: href
            selector: td a[href*='/dl.php?id=']
        leechers:
            selector: td[title='Leechers']
        seeders:
            selector: td[title='Seeders']
        size:
            filters:
                - name: parse_size
            selectors:
                - td:contains( GB)
                - td:contains( MB)
                - td:contains( KB)
                - td:contains( B)
        time:
            filters:
                - args: '[dd_MM_yyyy]'
                  name: parse_time
            selector: :self
        title:
            selector: td a[href*='/viewtopic.php?t=']
    rows:
        selector: table.tracker-table > tbody > tr.tracker-row:has(a[href*='/dl.php?id='])
tags:
    - 软件
    - 0day
    - 素材
    - 学习
    - 音乐制作
timezone_offset: "-0700"
urls:
    - https://audionews.org/
