name: 极速之星
no_login:
    selector: a[href*="login_pt.php"]
search_entry: /browse.php
search_param: s
selectors:
    fields:
        category:
            attr: href
            filters:
                - args: c
                  name: queryparam
            selector: a[href*='browse.php?c=']
        completed:
            filters:
                - name: parse_number
            selector: td:nth-child(7)
        detail:
            attr: href
            selector: a[href^='details.php?tid=']
        download:
            attr: href
            selector: a[href^='download.php?tid=']:not([href*='ssl'])
        leechers:
            filters:
                - name: parse_number
            selector: td:nth-child(6)
        seeders:
            filters:
                - name: parse_number
            selector: td:nth-child(5)
        size:
            filters:
                - name: parse_size
            selector: td:nth-child(4)
        subtitle:
            selector: td:nth-child(2)
        time:
            filters:
                - args: '[yyyy-MM-dd HH:mm]'
                  name: parse_time
            selector: td:nth-child(8) p.add_t
        title:
            selector: a[href^='details.php?tid=']
    rows:
        selector: table.torrenttable > tbody > tr:has(a[href^='details.php?tid='])
tags:
    - 教育网
    - 综合
    - 影视
timezone_offset: "+0800"
urls:
    - https://bitpt.cn/
