id: btschool
legacy_urls:
    - https://pt.btschool.net/
level_requirements:
    - id: 1
      name: User
      privilege: 新用户的默认级别
    - downloaded: 50GB
      id: 2
      interval: P4W
      name: Power User
      privilege: 一个邀请名额；查看NFO文档；查看用户列表；请求续种；查看其它用户的种子历史； 删除自己上传的字幕。
      ratio: 2
      seeding_bonus: 40000
    - downloaded: 100GB
      id: 3
      interval: P8W
      name: Elite User
      privilege: 直接发布种子； 查看排行榜
      ratio: 2.5
      seeding_bonus: 80000
    - downloaded: 300GB
      id: 4
      interval: P15W
      name: Crazy User
      privilege: 两个邀请名额；在做种/下载/发布的时候选择匿名模式
      ratio: 3
      seeding_bonus: 150000
    - downloaded: 500GB
      id: 5
      interval: P25W
      name: Insane User
      privilege: 查看普通日志
      ratio: 3.5
      seeding_bonus: 250000
    - downloaded: 1TB
      id: 6
      interval: P40W
      name: Veteran User
      privilege: 三个邀请名额；查看其它用户的评论、帖子历史；封存账号后不会被删除
      ratio: 4
      seeding_bonus: 400000
    - downloaded: 2TB
      id: 7
      interval: P60W
      is_kept: true
      name: Extreme User
      privilege: 更新过期的外部信息；查看Extreme User论坛；永远保留账号
      ratio: 4.5
      seeding_bonus: 600000
    - downloaded: 5TB
      id: 8
      interval: P80W
      is_kept: true
      name: Ultimate User
      privilege: 五个邀请名额
      ratio: 5
      seeding_bonus: 800000
    - downloaded: 10TB
      id: 9
      interval: P100W
      is_kept: true
      name: Nexus Master
      privilege: 十个邀请名额；发送邀请
      ratio: 5.5
      seeding_bonus: 1000000
    - group_type: vip
      id: 100
      name: 贵宾(VIP)
      privilege: 和 Nexus Master 拥有相同权限并被认为是精英成员。免除自动降级。
    - group_type: vip
      id: 101
      name: 其他
      privilege: 自定义等级
    - group_type: manager
      id: 200
      name: 养老族(Retiree)
      privilege: 退休后的管理组成员。
    - group_type: manager
      id: 201
      name: 发布员(Uploader)
      privilege: 专注的发布者。免除自动降级；可以查看匿名用户的真实身份。
    - group_type: manager
      id: 202
      name: 总版主(Moderator)
      privilege: |-
        map[__raw:BinaryExpression src:"可以查看管理组信箱、举报信箱；管理趣味盒内容、投票内容；可以编辑或删除任何发布的种子；可以管理候选；" +
                "可以管理论坛帖子、用户评论；可以查看机密日志；可以删除任何字幕；" +
                "可以管理日志中的代码、史册；可以查看用户的邀请记录；可以管理用户帐号的一般信息。" +
                "不能管理友情链接、最近消息、论坛版块；不能将种子设为置顶或促销；不能查看用户]
    - group_type: manager
      id: 203
      name: 管理员(Administrator)
      privilege: 除了不能改变站点设定、管理捐赠外，可以做任何事。
    - group_type: manager
      id: 204
      name: 维护开发员(Sysop)
      privilege: 网站开发/维护人员，可以改变站点设定，不能管理捐赠。
    - group_type: manager
      id: 205
      name: 主管(Staff Leader)
      privilege: 网站主管，可以做任何事。
name: BTSCHOOL
schema: nexusphp
tags:
    - 影视
    - 综合
    - 学习
timezone_offset: "+0800"
urls:
    - https://pt.btschool.club/
user_info:
    fields:
        seeding:
            selectors:
                - td.rowhead:contains('当前做种') + td, td.rowhead:contains('Current Seeding') + td, td.rowhead:contains('目前做種') + td
        seeding_size:
            selectors:
                - td.rowhead:contains('当前做种') + td, td.rowhead:contains('Current Seeding') + td, td.rowhead:contains('目前做種') + td
