# cinemageddon — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: 。selectors/user_info 若未列出则由 EnsureDefaults 自填校准默认。
# calibration: pending — 以下字段含 elementProcess/case/匿名函数，需人工翻译：
#   - search.time.filters[append]
#   - search.category.filters（匿名函数）
#   - userInfo.process（多步抓取流程，需适配器实现）

description: Cinemageddon is a Private Torrent Tracker for B-movies
id: cinemageddon
level_requirements:
    - downloaded: 20GB
      id: 1
      name: Power User
      privilege: Maximum of 8 concurrent downloads
      ratio: 1.2
      uploaded: 25GB
    - downloaded: 20GB
      id: 2
      name: CG Superfan
      privilege: Maximum of 12 concurrent downloads
      ratio: 1.5
      uploaded: 200GB
name: Cinemageddon
search_entry: /browse.php
search_param: search
selectors:
    fields:
        category:
            attr: href
            filters:
                - args: cat
                  name: queryparam
            selector: a[href*="browse.php?cat="]
        completed:
            selector: td:nth-child(6)
        detail:
            attr: href
            selector: a[href*="details.php?id="]
        download:
            attr: href
            selector: a[href*="download.php?id="]
        leechers:
            selector: td:nth-child(8)
        seeders:
            selector: td:nth-child(7)
        size:
            filters:
                - name: parse_size
            selector: td:nth-child(5)
        time:
            filters:
                - args: '[yyyy-MM-ddHH:mm:ss XXX]'
                  name: parse_time
            selector: td:nth-child(4)
        title:
            selector: a[href*="details.php?id="]
    rows:
        selector: table.torrenttable > tbody > tr:has(a[href*="browse.php?cat="])
tags:
    - 影视
timezone_offset: "-0700"
urls:
    - https://cinemageddon.net/
