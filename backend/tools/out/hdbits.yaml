# hdbits — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: 。selectors/user_info 若未列出则由 EnsureDefaults 自填校准默认。
# calibration: pending — 以下字段含 elementProcess/case/匿名函数，需人工翻译：
#   - search.title.filters（匿名函数）
#   - search.time.filters（匿名函数）
#   - search.category.filters（匿名函数）
#   - search.url.filters[prepend]
#   - userInfo.process（多步抓取流程，需适配器实现）

aka:
    - HDB
description: HDBits is a Private site for the HighDefinition Bittorrent Community
id: hdbits
level_requirements:
    - downloaded: 30GB
      id: 1
      interval: P4W
      name: 1080i
      privilege: You can view NFOs and request reseeds on poorly seeded torrents.
      ratio: 0.95
    - downloaded: 500GB
      id: 2
      interval: P4W
      name: 1080p
      privilege: As 1080i
      ratio: 1.4
    - downloaded: 500GB
      id: 3
      interval: P4W
      name: UHD
      privilege: As 1080i
      ratio: 2.5
name: HDBits
search_entry: /api/torrents
search_param: search
selectors:
    fields:
        category:
            selector: type_category
        completed:
            selector: times_completed
        detail:
            selector: id
        leechers:
            selector: leechers
        seeders:
            selector: seeders
        size:
            selector: size
        time:
            selector: utadded
        title:
            selector: :self
    rows:
        selector: data
tags:
    - 影视
    - 综合
timezone_offset: "+0000"
urls:
    - https://hdbits.org/
