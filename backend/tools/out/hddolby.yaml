name: HD Dolby
no_login:
    selector: script:contains('take2fa.php?returnto=')
schema: nexusphp
selectors:
    fields:
        subtitle:
            selectors:
                - td:has(a[href*='hit'][title]) > span:last
tags:
    - 影视
    - 综合
urls:
    - https://www.hddolby.com/
user_info:
    fields:
        bonus:
            filters:
                - name: parse_number
            selectors:
                - td.rowhead:contains('鲸币') + td
                - td.rowhead:contains('Karma Points') + td
        bonus_per_hour:
            filters:
                - name: parse_number
            selectors:
                - table[width='800'] > tbody > tr:contains('合计') > td:last-of-type
