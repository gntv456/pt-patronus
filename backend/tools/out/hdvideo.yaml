# hdvideo — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: nexusphp。selectors/user_info 若未列出则由 EnsureDefaults 自填校准默认。
# calibration: pending — 翻译自 PT-depiler，待真实页面校准。

id: hdvideo
legacy_urls:
    - https://hdvideo.one/
level_requirements:
    - name: User
    - downloaded: 128GB
      id: 1
      interval: P4W
      name: Power User
      privilege: 得到一个邀请名额；可以直接发布种子；可以查看NFO文档；可以查看用户列表；可以请求续种； 可以发送邀请； 可以查看排行榜；可以查看其它用户的种子历史(如果用户隐私等级未设置为"强")； 可以删除自己上传的字幕。
      ratio: 2
      seeding_bonus: 60480
    - downloaded: 256GB
      id: 2
      interval: P8W
      name: Elite User
      privilege: Elite User及以上用户封存账号后不会被删除。
      ratio: 2.5
      seeding_bonus: 137088
    - downloaded: 512GB
      id: 3
      interval: P12W
      name: Crazy User
      privilege: 可以在做种/下载/发布的时候选择匿名模式。
      ratio: 3
      seeding_bonus: 262080
    - downloaded: 1TB
      id: 4
      interval: P18W
      name: Insane User
      privilege: 得到两个邀请名额；可以查看普通日志。
      ratio: 3.5
      seeding_bonus: 453600
    - downloaded: 2TB
      id: 5
      interval: P24W
      is_kept: true
      name: Veteran User
      privilege: 可以查看其它用户的评论、帖子历史。Veteran User及以上用户会永远保留账号。
      ratio: 4
      seeding_bonus: 604800
    - downloaded: 4TB
      id: 6
      interval: P32W
      is_kept: true
      name: Extreme User
      privilege: 可以更新过期的外部信息；可以查看Extreme User论坛。
      ratio: 4.5
      seeding_bonus: 806400
    - downloaded: 6TB
      id: 7
      interval: P40W
      is_kept: true
      name: Ultimate User
      privilege: 得到三个邀请名额。
      ratio: 5
      seeding_bonus: 1008000
    - downloaded: 8TB
      id: 8
      interval: P52W
      is_kept: true
      name: Nexus Master
      privilege: 得到五个邀请名额。
      ratio: 5.5
      seeding_bonus: 1310400
name: HDVideo
schema: nexusphp
urls:
    - https://hdvideo.top/
user_info:
    fields:
        bonus:
            filters:
                - name: parse_number
            selectors:
                - '#top-stats-bar a.top-stat[href*=''mybonus.php''] b'
                - .top-account-stat-link.top-account-stat-bonus b
                - .rowhead:contains('电影票') + td
