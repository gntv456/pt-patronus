    - group_type: manager
      id: 205
      name: 主管
      privilege: 网站主管，可以做任何事。
name: PT@KEEPFRDS
schema: nexusphp
selectors:
    fields:
        subtitle:
            selectors:
                - a[href*='hit'][title]
                - a[href*='hit']:has(b)
tags:
    - 影视
    - 综合
urls:
    - https://pt.keepfrds.com/
user_info:
    fields:
        bonus:
            selectors:
                - td.rowhead:contains('魔力') + td
                - td.rowhead:contains('Karma'):contains('Points') + td
        bonus_per_hour:
            selectors:
                - tbody:has(>tr>td.embedded>i.fab.fa-btc)
        seeding:
            filters:
                - name: parse_number
            selectors:
                - a[href='/torrents.php?option-torrents=3']
        seeding_size:
            filters:
                - name: parse_size
            selectors:
                - td.rowhead:contains('当前做种') + td, td.rowhead:contains('Current Seeding') + td, td.rowhead:contains('目前做種') + td
