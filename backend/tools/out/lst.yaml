name: LST
schema: unit3d
selectors:
    fields:
        category:
            attr: title
            selector: .torrent-search-row__category
        completed:
            selector: .torrent-search-row__stat--completed
        detail:
            attr: href
            selector: .torrent-search-row__name > a
        leechers:
            selector: .torrent-search-row__stat--leechers
        seeders:
            selector: .torrent-search-row__stat--seeders
        size:
            attr: title
            filters:
                - name: parse_number
            selector: .torrent-search-row__stat--size
        title:
            selector: .torrent-search-row__name > a
    rows:
        selector: .torrent-results__list > .torrent-search-row
tags:
    - 综合
    - 影视
timezone_offset: "+0000"
urls:
    - https://lst.gg/
user_info:
    fields:
        bonus_per_hour:
            filters:
                - name: parse_number
        id:
            selector: span.profile-hero__account-item > i.fa-hashtag ~ span.profile-hero__account-value
        join_date: {}
        seeding_size:
            filters:
                - name: parse_size
        uploads:
            filters:
                - name: parse_number
