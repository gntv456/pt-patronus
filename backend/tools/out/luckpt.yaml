description: 汇聚多元精彩，启程旋律之旅。
id: luckpt
level_requirements:
    - name: User
      privilege: 新用户的默认级别。只能在每周六中午12点至每周日晚上11点59分发布种子。
    - downloaded: 100GB
      id: 1
      interval: P4W
      name: Power User
      privilege: |-
        map[__raw:BinaryExpression src:"得到一个邀请名额；可以直接发布种子；可以查看NFO文档；可以查看用户列表；可以请求续种； 可以发送邀请； " +
                '可以查看排行榜；可以查看其它用户的种子历史(如果用户隐私等级未设置为"强")； 可以删除自己上传的字幕。']
      ratio: 1.05
      seeding_bonus: 120000
    - downloaded: 200GB
      id: 2
      interval: P8W
      name: Elite User
      privilege: Elite User及以上用户封存账号后不会被删除。
      ratio: 1.55
      seeding_bonus: 320000
    - downloaded: 500GB
      id: 3
      interval: P15W
      name: Crazy User
      privilege: 得到两个邀请名额；可以在做种/下载/发布的时候选择匿名模式。
      ratio: 2.05
      seeding_bonus: 600000
    - downloaded: 1000GB
      id: 4
      interval: P25W
      name: Insane User
      privilege: 可以查看普通日志。
      ratio: 2.55
      seeding_bonus: 1000000
    - downloaded: 1.6TB
      id: 5
      interval: P40W
      is_kept: true
      name: Veteran User
      privilege: 得到三个邀请名额；可以查看其它用户的评论、帖子历史。Veteran User及以上用户会永远保留账号。
      ratio: 3.05
      seeding_bonus: 1800000
    - downloaded: 2.4TB
      id: 6
      interval: P60W
      is_kept: true
      name: Extreme User
      privilege: 可以更新过期的外部信息；可以查看Extreme User论坛。
      ratio: 3.55
      seeding_bonus: 2600000
    - downloaded: 3.0TB
      id: 7
      interval: P80W
      is_kept: true
      name: Ultimate User
      privilege: 得到五个邀请名额。
      ratio: 4.05
      seeding_bonus: 3800000
    - downloaded: 4.9TB
      id: 8
      interval: P100W
      is_kept: true
      name: Nexus Master
      privilege: 得到十个邀请名额。
      ratio: 4.55
      seeding_bonus: 5000000
name: LuckPT
