# monikadesign — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: unit3d。⚠ 本项目暂无该 schema 适配器，待 M3+ 实现。
# calibration: pending — 以下字段含 elementProcess/case/匿名函数，需人工翻译：
#   - search.category.filters[split]
#   - search.time（data）

aka:
    - MDU
    - 莫妮卡
id: monikadesign
level_requirements:
    - id: 1
      name: User
      privilege: 新用户默认等级;可以正常下载/上传，访问论坛
    - id: 2
      interval: P1M
      name: PowerUser
      privilege: 访问邀请区
      uploaded: 1TiB
    - id: 3
      interval: P2M
      name: SuperUser
      privilege: 访问邀请区
      uploaded: 2TiB
    - id: 4
      interval: P3M
      name: ExtremeUser
      privilege: 自动通过候选 调整隐私设置 访问邀请区
      uploaded: 5TiB
    - id: 5
      interval: P6M
      name: InsaneUser
      privilege: 自动通过候选 调整隐私设置 访问邀请区
      uploaded: 10TiB
    - id: 6
      interval: P12M
      name: Veteran
      privilege: 个人全局双倍上传 自动通过候选 调整隐私设置 访问邀请区
      uploaded: 15TiB
    - group_type: user
      id: 7
      interval: P1M
      name: Seeder
      privilege: 自动通过候选 调整隐私设置 访问邀请区
    - id: 8
      interval: P3M
      name: Archivist
      privilege: 个人全局双倍上传 自动通过候选 调整隐私设置 访问邀请区
name: Monikadesign
schema: unit3d
selectors:
    fields:
        category:
            selectors:
                - td.torrent-listings-format
        completed:
            selectors:
                - a[href*="/history"] > span.text-orange
        size:
            filters:
                - name: parse_size
            selectors:
                - td.torrent-listings-size > span
        subtitle:
            selectors:
                - span.torrent-listings-subhead
        time:
            filters:
                - name: parse_time
            selectors:
                - td.torrent-listings-age > span
tags:
    - 动漫
timezone_offset: "+0800"
urls:
    - https://monikadesign.uk/
user_info:
    fields:
        bonus:
            filters:
                - name: parse_number
            selectors:
                - li.ratio-bar__points a:has( > i.fa-coins)
        bonus_per_hour:
            filters:
                - name: parse_number
            selectors:
                - aside .panelV2 dd:nth-child(6)
        uploads:
            filters:
                - name: parse_number
            selectors:
                - div.container div.block div.text-center a[href*="/uploads"]
