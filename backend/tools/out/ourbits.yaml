level_requirements:
    - id: 1
      name: User
      privilege: 新用户的默认级别。最多可以同时下载10个种子。
    - downloaded: map[__raw:BinaryExpression src:100 * GB]
      id: 2
      interval: P5W
      name: Power User
      privilege: 可以查看NFO文档；可以查看用户列表；可以请求续种；可以查看排行榜；可以查看其它用户的种子历史(如果用户隐私等级未设置为"强")；可以删除自己上传的字幕。最多可以同时下载20个种子
      ratio: 2
    - downloaded: map[__raw:BinaryExpression src:350 * GB]
      id: 3
      interval: P10W
      name: Elite User
      privilege: Elite User及以上用户封存账号后不会被删除。此等级及以上没有下载数限制。可以查看论坛Elite User(邀请交流版)
      ratio: 2.5
    - downloaded: map[__raw:BinaryExpression src:500 * GB]
      id: 4
      interval: P15W
      name: Crazy User
      privilege: 可以在做种/下载/发布的时候选择匿名模式
      ratio: 3
    - downloaded: map[__raw:BinaryExpression src:1 * TB]
      id: 5
      interval: P20W
      name: Insane User
      privilege: 可以查看普通日志
      ratio: 3.5
    - downloaded: map[__raw:BinaryExpression src:2 * TB]
      id: 6
      interval: P25W
      is_kept: true
      name: Veteran User
      privilege: 可以查看其它用户的评论、帖子历史。Veteran User及以上用户会永远保留账号
      ratio: 4
    - downloaded: map[__raw:BinaryExpression src:4 * TB]
      id: 7
      interval: P30W
      is_kept: true
      name: Extreme User
      privilege: 得到一个永久邀请；可以更新过期的外部信息
      ratio: 4.5
    - downloaded: map[__raw:BinaryExpression src:6 * TB]
      id: 8
      interval: P40W
      is_kept: true
      name: Ultimate User
      privilege: 得到两个永久邀请
      ratio: 5
    - downloaded: map[__raw:BinaryExpression src:8 * TB]
      id: 9
      interval: P52W
      is_kept: true
      name: Nexus Master
      privilege: 得到三个永久邀请
      ratio: 5.5
    - group_type: vip
      id: 100
      name: 贵宾
      privilege: 免除自动降级，只计算上传量，不计算下载量。
    - group_type: vip
      id: 101
      name: 荣誉会员
      privilege: 退休后的管理组成员。
    - group_type: manager
      id: 200
      name: 发布员
      privilege: 官方小组的成员。免除自动降级；可以查看匿名用户的真实身份。
    - group_type: manager
      id: 201
      name: 总版主
      privilege: |-
        map[__raw:BinaryExpression src:"可以查看管理组信箱、举报信箱；管理趣味盒内容、投票内容；可以编辑或删除任何发布的种子；可以管理候选；可以管理论坛帖子、用户评论；" +
                "可以查看机密日志；可以删除任何字幕；可以管理日志中的代码、史册；可以查看用户的邀请记录；可以管理用户帐号的一般信息。" +
                "不能管理友情链接、最近消息、论坛版块；不能将种子设为置顶或促销；不能查看用户IP或Email等机密信息]
    - group_type: manager
      id: 202
      name: 管理员
      privilege: 除了不能改变站点设定、管理捐赠外，可以做任何事。
    - group_type: manager
      id: 203
      name: 维护开发员
      privilege: 网站开发/维护人员，可以改变站点设定，不能管理捐赠。
    - group_type: manager
      id: 204
      name: 主管
      privilege: 网站主管，可以做任何事。
name: OurBits
