# passthepopcorn — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: gazelle。⚠ 本项目暂无该 schema 适配器，待 M3+ 实现。
# calibration: pending — 以下字段含 elementProcess/case/匿名函数，需人工翻译：
#   - userInfo.seedingSize.filters（匿名函数）
#   - userInfo.joinTime（elementProcess）
#   - userInfo.seeding.filters（匿名函数）
#   - userInfo.bonus.filters（匿名函数）
#   - userInfo.uploads.filters（匿名函数）
#   - userInfo.bonusPerHour.filters（匿名函数）
