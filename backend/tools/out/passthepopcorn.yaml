aka:
    - PTP
description: PassThePopcorn (PTP) is a Private site for MOVIES
id: passthepopcorn
level_requirements:
    - id: 1
      name: User
      privilege: Upload torrents. Download torrents
    - id: 2
      interval: P1W
      name: Member
      privilege: Create requests. Hide username from peerlists. Download a .zip file of snatches on their profile
      ratio: 1.05
      uploaded: 40GB
    - id: 3
      interval: P4W
      is_kept: true
      name: Power User
      name_aka:
        - PU
      privilege: Immunity to inactivity pruning. Access to PU forums. Access to invite forums. Freeleech access in advanced search. Can send bonus points to other users. Can edit movie group information. Access to on-site notifications. Access to the IRC announce channels. Create collections and edit existing ones
      ratio: 1.05
      uploaded: 80GB
      uploads: 1
    - id: 4
      interval: P10W
      is_kept: true
      name: Elite
      privilege: Access to Elite forums. Can purchase invites from the bonus point store
      ratio: 1.05
      uploaded: 500GB
      uploads: 50
    - id: 5
      interval: P16W
      is_kept: true
      name: Torrent Master
      name_aka:
        - TM
      privilege: Access to TM forums. Receive 2 invites per month
      ratio: 1.05
      uploaded: 1TB
      uploads: 200
    - id: 6
      interval: P24W
      is_kept: true
      name: Torrent King
      name_aka:
        - TK
      privilege: Can create personal collections to feature on their profile. Granted ability to double post in forums. Unlimited search and log results. Immunity from ratio-based demotion
      ratio: 1.05
      uploaded: 5TB
      uploads: 500
    - id: 7
      interval: P36W
      is_kept: true
      name: Custom Class
      name_aka:
        - CC
      privilege: Can chose their own class title. Immunity from ratio-based demotion
      ratio: 1.05
      uploaded: 10TB
      uploads: 1000
name: PassThePopcorn
schema: gazelle
search_entry: /torrents.php
tags:
    - 电影
timezone_offset: "+0000"
urls:
    - https://passthepopcorn.me/
user_info:
    fields:
        bonus:
            selector: div.panel__heading:contains('Stats') + div.panel__body > ul.list > li:contains('Points:')
        bonus_per_hour:
            selector: div.panel__heading:contains('Stats') + div.panel__body > ul.list > li:contains('Points per hour:')
        downloaded:
            selector: div.panel__heading:contains('Stats') + div.panel__body > ul.list > li:contains('Downloaded:')
        id:
            selectors:
                - a[href*='user.php?id=']:first
        join_date:
            selectors:
                - div.panel__heading:contains('Stats') + div.panel__body > ul.list > li:contains('Joined:') > span
        level:
            selector: div.panel__heading:contains('Personal') + div.panel__body > ul.list > li:contains('Class:')
        name:
            selectors:
                - a[href*='user.php?id=']:first
        ratio:
            selector: div.panel__heading:contains('Stats') + div.panel__body > ul.list > li:contains('Ratio:')
        seeding:
            selectors:
                - div.panel__heading:contains('Community') + div.panel__body > ul.list > li:contains('Seeding:')
        seeding_size:
            selectors:
                - div.panel__heading:contains('Community') + div.panel__body > ul.list > li:contains('Seeding size:')
        uploaded:
            selector: div.panel__heading:contains('Stats') + div.panel__body > ul.list > li:contains('Uploaded:')
        uploads:
            selectors:
                - div.panel__heading:contains('Community') + div.panel__body > ul.list > li:contains('Uploaded:')
