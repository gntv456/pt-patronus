      id: 200
      name: 贵宾(VIP)
      privilege: 由管理员仔细斟酌后分配给他们认为对于站点某方面有特殊贡献的用户。
    - group_type: manager
      id: 300
      name: 养老族(Retiree)
      privilege: 由管理员授予。
    - group_type: manager
      id: 301
      name: 发布员(Uploader)
      privilege: 由管理员分配(参见'发布'部分以了解详情)。
    - group_type: manager
      id: 302
      name: 总版主(Moderator)
      privilege: 无需多问，我们会找到你的！
