level_requirements:
    - id: 1
      name: User
      privilege: 新用户的默认级别。
    - downloaded: 200GB
      id: 2
      interval: P4W
      name: Power User
      privilege: 可以查看NFO文档；可以查看用户列表；可以请求续种；可以查看排行榜；可以查看其它用户的种子历史(如未设置隐私“强”)；可以删除自己上传的字幕；可以浏览论坛邀请专版。
      ratio: 1
      seeding_bonus: 20000
    - downloaded: 350GB
      id: 3
      interval: P8W
      name: Elite User
      privilege: Elite User及以上用户封存账号后不会被删除。
      ratio: 1.1
      seeding_bonus: 50000
    - downloaded: 500GB
      id: 4
      interval: P15W
      name: Crazy User
      privilege: 可以在做种/下载/发布时选择匿名模式。
      ratio: 1.2
      seeding_bonus: 200000
    - downloaded: 1TB
      id: 5
      interval: P25W
      name: Insane User
      privilege: 可以查看普通日志。
      ratio: 1.3
      seeding_bonus: 400000
    - downloaded: 2TB
      id: 6
      interval: P40W
      is_kept: true
      name: Veteran User
      privilege: 可以查看其它用户的评论、帖子历史。Veteran User及以上等级账号永久保留。
      ratio: 1.5
      seeding_bonus: 600000
    - downloaded: 3TB
      id: 7
      interval: P60W
      is_kept: true
      name: Extreme User
      privilege: 可以更新过期的外部信息；可以查看Extreme User论坛。
      ratio: 1.5
      seeding_bonus: 800000
    - downloaded: 4TB
      id: 8
      interval: P80W
      is_kept: true
      name: Ultimate User
      privilege: 同白银用户等级权限。
      ratio: 1.7
      seeding_bonus: 1000000
    - downloaded: 6TB
      id: 9
      interval: P100W
      is_kept: true
      name: Nexus Master
      privilege: 同白银用户等级权限。
      ratio: 1.8
      seeding_bonus: 1200000
name: PTHome
schema: nexusphp
selectors:
    fields:
        subtitle:
            selectors:
                - a[href^='details.php?id='][title]:has(b)
                - a[href*='details.php?id='][href*='hit']
                - a[href*='hit'][title]
                - a[href*='hit']:has(b)
