# ptlao — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: nexusphp。selectors/user_info 若未列出则由 EnsureDefaults 自填校准默认。
# calibration: pending — 翻译自 PT-depiler，待真实页面校准。

id: ptlao
level_requirements:
    - id: 1
      name: 幼儿园
      privilege: 只能在每周六中午12点至每周日晚上11点59分发布种子
    - downloaded: 5GB
      id: 2
      interval: P4D
      name: 小学
      privilege: 得到一个邀请名额 可以直接发布种子 可以查看NFO文档 可以查看用户列表 可以请求续种  可以发送邀请  可以查看排行榜 可以查看其它用户的种子历史(如果用户隐私等级未设置为强) 可以删除自己上传的字幕
      ratio: 0.1
      seeding_bonus: 300
    - downloaded: 120GB
      id: 3
      interval: P4W
      name: 初中
      privilege: 封存账号后不会被删除
      ratio: 1.25
      seeding_bonus: 80000
    - downloaded: 300GB
      id: 4
      interval: P15W
      name: 高中
      privilege: 得到两个邀请名额 可以在做种/下载/发布的时候选择匿名模式
      ratio: 2.05
    - downloaded: 500GB
      id: 5
      interval: P25W
      name: 大专
      privilege: 可以查看普通日志
      ratio: 2.55
    - downloaded: 750GB
      id: 6
      interval: P40W
      is_kept: true
      name: 本科
      privilege: 得到三个邀请名额 可以查看其它用户的评论、帖子历史 永远保留账号
      ratio: 3.05
    - downloaded: 1TB
      id: 7
      interval: P60W
      is_kept: true
      name: 研究生
      privilege: 可以更新过期的外部信息
      ratio: 3.55
    - downloaded: 1.5TB
      id: 8
      interval: P80W
      is_kept: true
      name: 博士
      privilege: 得到五个邀请名额
      ratio: 4.05
    - downloaded: 3TB
      id: 9
      interval: P100W
      is_kept: true
      name: 博士后
      privilege: 得到十个邀请名额
      ratio: 4.55
name: PTLAO
schema: nexusphp
tags:
    - 成人
    - 综合
timezone_offset: "+0800"
urls:
    - https://ptlao.top/
