# retroflix — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: nexusphp。selectors/user_info 若未列出则由 EnsureDefaults 自填校准默认。
# calibration: pending — 以下字段含 elementProcess/case/匿名函数，需人工翻译：
#   - search.time（elementProcess/text）
#   - search.subTitle（elementProcess）
#   - search.url.filters[prepend]
#   - userInfo.joinTime.filters[split]
#   - userInfo.process（多步抓取流程，需适配器实现）

aka:
    - RF
description: RetroFlix is a Private site for Classic Movies / TV / General Releases
id: retroflix
level_requirements:
    - id: 1
      name: Film Dummy
    - id: 2
      name: Film Stunt
    - downloaded: 50GB
      id: 3
      interval: P4W
      name: Movie Lover
      privilege: Can view Topten, ask for reseed, section.
      ratio: 1.05
    - downloaded: 120GB
      id: 4
      interval: P8W
      name: Cinema Addicted
      privilege: Cinema Addicted or above would never be deleted if parked.
      ratio: 1.55
    - downloaded: 300GB
      id: 5
      interval: P15W
      name: Film Critic
      privilege: Can view torrent structure and can set an userbar. Film Critic or above would never be deleted when parked.
      ratio: 2.05
    - group_type: vip
      id: 6
      name: VIP
    - group_type: manager
      id: 7
      name: Uploader
      privilege: Can upload torrents, view anonymous uploaders and view banned torrents.
name: RetroFlix
schema: nexusphp
search_entry: /browse
selectors:
    fields:
        completed:
            selector: div.row > div:nth-child(4)
        detail:
            filters:
                - args: id
                  name: queryparam
        leechers:
            selector: div.row > div:nth-child(6)
        seeders:
            selector: div.row > div:nth-child(5)
        size:
            filters:
                - name: parse_size
            selector: div.row > div:nth-child(3)
        subtitle:
            selector: div[data-content]:has(a[href^='/browse/t/'])
        time:
            selector: div.row > div:nth-child(2)
        title:
            selector: a[href^='/browse/t/']
    rows:
        selector: div.row > div.col-12 > div.row:gt(0)
tags:
    - 影视
    - 综合
timezone_offset: "+0000"
urls:
    - https://retroflix.net/
    - https://retroflix.club/
user_info:
    fields:
        join_date:
            filters:
                - args: '[dd-MM-yyyy HH:mm:ss]'
                  name: parse_time
