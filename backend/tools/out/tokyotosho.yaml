aka:
    - 東京 図書館
description: Tokyo Toshokan is a Public BitTorrent Library for JAPANESE Media
id: tokyotosho
legacy_urls:
    - https://tokyotosho.se/
name: Tokyo Toshokan
search_entry: /search.php
search_param: terms
selectors:
    fields:
        category:
            attr: href
            filters:
                - args: cat
                  name: queryparam
            selector: a[href*='cat=']
        completed:
            selector: td.stats
        detail:
            attr: href
            selector: a[href^="details.php?id="]
        download:
            attr: href
            selector: td.desc-top a[type="application/x-bittorrent"]
        leechers:
            selector: td.stats
        seeders:
            selector: td.stats
        size:
            filters:
                - name: parse_size
            selector: td.desc-bot
        subtitle:
            selector: td.desc-bot
        time:
            filters:
                - args: '[UTC +0000]'
                  name: replace
                - args: '[yyyy-MM-dd HH:mm XXX]'
                  name: parse_time
            selector: td.desc-bot
        title:
            selector: td.desc-top a[type="application/x-bittorrent"]
    rows:
        selector: table.listing tr.category_0
urls:
    - https://www.tokyotosho.info/
    - https://tokyo-tosho.net/
