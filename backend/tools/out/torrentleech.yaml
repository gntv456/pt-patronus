# torrentleech — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: 。selectors/user_info 若未列出则由 EnsureDefaults 自填校准默认。
# calibration: pending — 以下字段含 elementProcess/case/匿名函数，需人工翻译：
#   - search.url.filters[prepend]
#   - search.link.filters（匿名函数）
#   - search.category.filters（匿名函数）
#   - userInfo.process（多步抓取流程，需适配器实现）

aka:
    - TL
description: TorrentLeech (TL) is a Private Torrent Tracker for 0DAY / GENERAL. not here _ not scene
id: torrentleech
level_requirements:
    - name: User
    - id: 1
      interval: P2W
      name: Power User
      privilege: 'Increased Points: 3%, Minimum Seeding Time: 8 days'
      ratio: 1.1
      uploaded: 200GB
    - id: 2
      interval: P12W
      name: Super User
      privilege: 'Increased Points: 5%, Minimum Seeding Time: 7 days'
      ratio: 2
      uploaded: 1TB
    - id: 3
      interval: P24W
      name: Extreme User
      privilege: 'Increased Points: 6%, Minimum Seeding Time: 6 days'
      ratio: 5
      uploaded: 10TB
    - id: 4
      interval: P52W
      name: TL GOD
      privilege: 'Increased Points: 8%, Minimum Seeding Time: 4 days'
      ratio: 8
      uploaded: 50TB
name: TorrentLeech
no_login:
    selector: div.login-container form[name='login-form']
search_entry: /torrents/browse/list/query
selectors:
    fields:
        category:
            selector: categoryID
        completed:
            selector: numComments
        detail:
            selector: fid
        download:
            selector: :self
        leechers:
            selector: leechers
        seeders:
            selector: seeders
        size:
            selector: size
        time:
            filters:
                - name: parse_time
            selector: addedTimestamp
        title:
            selector: name
    rows:
        selector: torrentList
tags:
    - 综合
timezone_offset: "+0000"
urls:
    - https://www.torrentleech.org/
    - https://www.torrentleech.cc/
    - https://www.torrentleech.me/
    - https://www.tleechreload.org/
    - https://www.tlgetin.cc/
