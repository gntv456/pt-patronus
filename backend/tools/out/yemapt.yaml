# yemapt — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: yemapt。⚠ 本项目暂无该 schema 适配器，待 M3+ 实现。
# calibration: pending — 以下字段含 elementProcess/case/匿名函数，需人工翻译：
#   - search.completed（text）
#   - search.url.filters[prepend]
#   - search.link.filters[prepend]
#   - userInfo.process（多步抓取流程，需适配器实现）

description: YemaPT 是一个由全新技术架构构建而来的综合类资源PT站点。有分享率和登录要求，可访问 wiki.yemapt.org 查看。
id: yemapt
name: YemaPT
schema: yemapt
search_entry: /api/torrent/fetchOpenTorrentList
search_param: keyword
selectors:
    fields:
        category:
            selector: categoryName
        completed: {}
        detail:
            selector: id
        download:
            selector: id
        leechers:
            selector: leechNum
        seeders:
            selector: seedNum
        size:
            selector: fileSize
        subtitle:
            selector: shortDesc
        time:
            filters:
                - args: '[yyyy-MM-dd''T''HH:mm:ss.SSSXXX]'
                  name: parse_time
            selector: listingTime
        title:
            selector: showName
    rows:
        selector: data
tags:
    - 综合
timezone_offset: "+0800"
urls:
    - https://www.yemapt.org/
