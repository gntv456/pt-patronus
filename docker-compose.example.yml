# PTPatronus 终端用户部署 —— 复制保存为 docker-compose.yml，docker compose up -d 即用。
# 首次启动后端自动生成密钥（落 ./data/），零配置。升级：docker compose pull && docker compose up -d。

services:
  ptpatronus:
    # 版本锁定（收权加固）：默认锁定具体版本号（与 update-manifest 的 docker.image 一致），
    # 升级 = 改这里的版本号再 up -d——可精确回滚（改回旧版本号即可），不会被 latest 漂移。
    # 想跟随最新版：把 tag 改成 latest 并保留 pull_policy: always（失去回滚锚点，自担）。
    image: ghcr.io/gntv456/pt-patronus:1.03.29
    container_name: ptpatronus
    restart: unless-stopped
    # 锁定版本时不需要 always 拉取；改用 latest 跟随时再取消注释：
    # pull_policy: always
    ports:
      - "8088:8088"            # 主机端口:容器端口（改左边的 8088 换访问端口）
    environment:
      # 定时任务表达式按容器本地时区解释；不设 TZ 时容器是 UTC，「0 8 * * *」会晚 8 小时才跑。
      # 设置 → 调度频率 会显示当前生效时区与下次执行时间。
      TZ: ${TZ:-Asia/Shanghai}
      # APP_ENV 必填：触发 release 模式 + 密钥自动生成 + 生产安全限制。
      # 账号为本地用户名密码：空库首次登录自动建号并成为管理员，无需任何外部 VIP 站点配置。
      # 从旧版（好学 VIP 账号）升级：保持 ./data 卷不动，设下面的 ADMIN_PASSWORD 后重启即可。
      # 后端给存量账号原地补本地密码（不改 User.ID、不新建账号），站点/下载器/订阅等
      # 配置全部保留，无需导出导入、无需跑 CLI；起来后用原用户名 + 该密码登录。
      # 其余（数据库 SQLite、cron、限流…）全用后端默认，不用写。
      APP_ENV: release
      # 可选：compose 预设账号 / 升级自动迁移（按实例状态自动判断）：
      #   · 空库 → 启动即建管理员，堵住「首登谁先访问谁拿 admin」抢注窗口
      #   · 存量账号无本地密码 → 原地补密码，User.ID 不变，配置数据全部保留
      #   · 已有本地密码 → 忽略，绝不覆盖用户在 UI 改过的密码
      # ⚠ 账号引导需 ≥1.03.29 镜像；1.03.28 及更早版本会静默忽略这几个变量。
      # ADMIN_USERNAME: admin
      # ADMIN_PASSWORD: 'Abcd12345678'        # ≥8 位含字母数字；docker inspect 可见，勿提交进仓库
      # ADMIN_PASSWORD_FILE: /run/secrets/ptp_admin_pw   # 推荐：优先于明文，配合 Docker secrets
      #   用 _FILE 时记得把该 secrets 文件挂进容器 volumes（文件内容即密码，权限 600）。
      # 高级（按需取消注释）：
      # CORS_ALLOWED_ORIGINS: https://你的域名   # 反代/公网时收敛 CORS
      # TRUSTED_PROXIES: 172.16.0.0/12          # 反代后填其 CIDR
      # SECRET_KEY: openssl rand -base64 32 的输出        # 自控密钥；否则后端自动生成 + 持久化
      # ACTIVATION_SECRET: openssl rand -base64 32 的输出
      # 在线更新：后端读这份 manifest 检查新版本（Web UI「设置→关于→检查更新」+ 客户端 OTA）。
      # 官方清单随发版更新（latestVersion / docker.image 等），默认即用；想关掉检查就注释掉这行。
      # 注：此前误指 ptpatronus-plugin-market 仓库的 manifest（停滞在 1.03.23），会导致自检失效；
      # 现改指主仓 raw manifest（与主仓 update-manifest.json 同源、随发版回填）。
      UPDATE_MANIFEST_URL: https://raw.githubusercontent.com/gntv456/pt-patronus/main/update-manifest.json
      # Compose 项目扫描：容器内路径，对应下方 /host/compose 挂载
      COMPOSE_SCAN_DIR: /host/compose
      # 宿主机 compose 项目根（页面反推显示宿主路径用）；按实际放 compose 的目录改
      COMPOSE_ROOT: /opt
      # agent 自动更新：最新版本号 + 下载地址（含 {arch} 占位）
      AGENT_LATEST_VERSION: 0.3.1
      AGENT_DOWNLOAD_URL: https://github.com/gntv456/pt-patronus/releases/latest/download/ptpatronus-agent-linux-{arch}
      # agent 自更新的 sha256：留空则点「升级」必失败——agent 侧拒绝无校验的二进制替换（供应链防线）。
      # 下载地址按 {arch} 展开，各架构哈希不同：多架构机群写成「amd64=<hex> arm64=<hex>」，agent 取本机那条。
      AGENT_CHECKSUM: ""
    volumes:
      - ./data:/app/data       # 数据库 + 自动生成的密钥（务必持久化，否则重启换密钥用户被踢）

      # ⚠ 安全提示（收权加固）：以下三行默认注释掉——挂载 / 与 docker.sock
      # 意味着应用层失陷 = 宿主 root。按需取消注释并尽量收窄：
      #
      # 文件管理器「本机」存储：只挂需要的盘（推荐），根路径填 /hostfs/vol1；
      # 确要浏览整个宿主才挂 /:/hostfs（去 :ro 后可写整个宿主文件系统）。
      # - /vol1:/hostfs/vol1
      # - /:/hostfs
      #
      # Docker 容器管理（运维中心 → Docker → 本机模式）：不挂则 Docker 功能不可用
      # - /var/run/docker.sock:/var/run/docker.sock
      #
      # Compose 项目管理：挂载宿主 compose 目录扫描已有项目；按实际放 compose 的目录改
      # - /opt:/host/compose
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/api/v1/system/health"]
      interval: 30s
      timeout: 3s
      retries: 3

# 想用 PostgreSQL 代替 SQLite？见 README/05-部署指南.md，或仓库 docker-compose.yml（开发版含 pg profile）。
