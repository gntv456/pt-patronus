# PTPatronus — Docker Compose
# 后端服务端。生产请用强 SECRET_KEY / ACTIVATION_SECRET（通过 .env 或环境变量注入）。

services:
  ptpatronus:
    build:
      context: .
      dockerfile: Dockerfile
    image: ptpatronus:latest
    container_name: ptpatronus
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      APP_ENV: release
      HTTP_ADDR: ":8088"
      # 安全：release 模式必填（>=32 字节随机串），否则容器启动即报错退出
      SECRET_KEY: ${SECRET_KEY:-}
      ACTIVATION_SECRET: ${ACTIVATION_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # 好学 APP 专属 VIP 准入
      AUTH_SITE_ENABLED: ${AUTH_SITE_ENABLED:-false}
      AUTH_SITE_URL: ${AUTH_SITE_URL:-https://www.hxpt.org}
      AUTH_VIP_LEVEL: ${AUTH_VIP_LEVEL:-1}
      # 数据库（默认 SQLite；切 PostgreSQL 设 DB_TYPE=postgres + DATABASE_URL）
      DB_TYPE: ${DB_TYPE:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      # Compose 项目扫描根（容器内路径，对应宿主 COMPOSE_ROOT）
      COMPOSE_SCAN_DIR: ${COMPOSE_SCAN_DIR:-/host/compose}
    volumes:
      - ./data:/app/data
      # Docker 管理：挂载 docker.sock 让本机容器管理可用（运维中心 → Docker → 本机模式）
      - /var/run/docker.sock:/var/run/docker.sock
      # Compose 项目管理：挂载宿主 compose 目录（扫描已有项目）
      # 默认 /opt，按需改为你的 compose 项目根（如 /root /home 等）
      - ${COMPOSE_ROOT:-/opt}:/host/compose
      # 文件管理器「本机」存储：挂载宿主存储空间到容器，否则容器内只能看到自己的根文件系统，
      # 看不到 NAS 上的 /vol1、/video 等目录。飞牛(fnOS)存储空间默认在 /vol1、/vol2 …
      # 在本机存储根路径里填 /host/fs 即可浏览整个宿主文件系统（含 /host/fs/vol1/1000/）。
      # 如只暴露单块盘，改为 - /vol1:/host/fs/vol1，并把根路径填 /host/fs/vol1
      - ${HOST_FS_ROOT:-/}:/host/fs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/api/v1/system/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # 可选：PostgreSQL（默认不启用；需要时 docker compose --profile pg up）
  postgres:
    image: postgres:16-alpine
    profiles: ["pg"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ptpatronus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ptpatronus
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata:
