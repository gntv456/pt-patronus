# PTPatronus — Docker Compose
# 后端服务端。生产请用强 SECRET_KEY / ACTIVATION_SECRET（通过 .env 或环境变量注入）。

services:
  ptpatronus:
    build:
      context: .
      dockerfile: Dockerfile
    image: ptpatronus:latest
    container_name: ptpatronus
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      APP_ENV: release
      HTTP_ADDR: ":8088"
      # 安全：release 模式必填（>=32 字节随机串），否则容器启动即报错退出
      SECRET_KEY: ${SECRET_KEY:-}
      ACTIVATION_SECRET: ${ACTIVATION_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # 好学 APP 专属 VIP 准入
      AUTH_SITE_ENABLED: ${AUTH_SITE_ENABLED:-false}
      AUTH_SITE_URL: ${AUTH_SITE_URL:-https://www.hxpt.org}
      AUTH_VIP_LEVEL: ${AUTH_VIP_LEVEL:-1}
      # 数据库（默认 SQLite；切 PostgreSQL 设 DB_TYPE=postgres + DATABASE_URL）
      DB_TYPE: ${DB_TYPE:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      # Compose 项目扫描根（容器内路径，对应宿主 COMPOSE_ROOT）
      COMPOSE_SCAN_DIR: ${COMPOSE_SCAN_DIR:-/host/compose}
    volumes:
      - ./data:/app/data
      # ⚠ 安全提示（收权加固）：以下两行默认注释掉。挂载 docker.sock = 容器内
      # RCE 即宿主 root；HOST_FS_ROOT=/ = 文件管理器可写整个宿主文件系统。
      # 需要运维中心 Docker 管理时手动取消注释；文件管理器请只挂需要的目录
      # （如 - /vol1:/host/fs/vol1），并在本机存储根路径填对应子路径。
      # - /var/run/docker.sock:/var/run/docker.sock
      # Compose 项目管理：挂载宿主 compose 目录（扫描已有项目）。
      # 按需改为你的 compose 项目根并取消注释（如 /opt 或 /root）。
      # - ${COMPOSE_ROOT:-/opt}:/host/compose
      # 文件管理器「本机」存储：默认不挂宿主根。需要浏览 NAS 目录时改为
      # 具体盘（如 - /vol1:/host/fs/vol1），根路径填 /host/fs/vol1——
      # 挂载 / 会把整个宿主文件系统暴露给 admin 文件管理器。
      # - ${HOST_FS_ROOT:-/}:/host/fs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/api/v1/system/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # 可选：PostgreSQL（默认不启用；需要时 docker compose --profile pg up）
  postgres:
    image: postgres:16-alpine
    profiles: ["pg"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ptpatronus
      # 收权加固：去掉默认弱密码 changeme——未设 POSTGRES_PASSWORD 时启动即失败并提示，
      # 避免带默认口令的 PG 实例悄悄跑起来（且 5432 还映射到了宿主）。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在环境变量设置 POSTGRES_PASSWORD（openssl rand -base64 24），不要使用弱密码}
      POSTGRES_DB: ptpatronus
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata:
