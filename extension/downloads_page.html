<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>下载任务 · PTPatronus</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    .topbar {
      position: sticky; top: 0; z-index: 5;
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      padding: 12px 14px;
      background: rgba(7, 16, 14, 0.72);
      backdrop-filter: blur(24px) saturate(160%);
      border-bottom: 1px solid var(--glass-border);
    }
    .topbar select { min-width: 130px; }
    #addurl { flex: 1; min-width: 200px; }
    .topbar button { padding: 7px 14px; font-size: 11px; }

    /* 汇总速度条 */
    .speedline {
      display: flex; gap: 18px; align-items: center;
      padding: 9px 16px;
      font: 600 12px var(--mono);
      color: var(--ink-dim);
      border-bottom: 1px solid rgba(168,196,180,0.08);
      background: rgba(10, 24, 20, 0.5);
    }
    .speedline b { color: var(--lime); font-weight: 700; }
    .speedline .up b { color: var(--aqua); }
    .speedline .cnt b { color: var(--ink); }

    .tblwrap { overflow: auto; max-height: calc(100vh - 118px); }
    td.name { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    td.num { font-family: var(--mono); font-size: 11px; }

    /* 进度：水润光柱 */
    .prog { width: 110px; height: 6px; border-radius: 6px; background: rgba(5,16,12,0.7); box-shadow: inset 0 1px 3px rgba(0,0,0,0.6); overflow: hidden; position: relative; }
    .prog i {
      display: block; height: 100%;
      background: linear-gradient(90deg, var(--violet), var(--aqua));
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(61,223,255,0.5);
      transition: width 0.5s ease;
    }
    .prog.done i { background: linear-gradient(90deg, var(--lime-deep), var(--lime)); box-shadow: 0 0 10px rgba(200,255,61,0.5); }
    .pct { font: 500 10px var(--mono); color: var(--ink-faint); margin-left: 6px; }

    .st-downloading { color: var(--aqua); font-weight: 700; }
    .st-uploading, .st-stalledUP, .st-forcedUP { color: var(--lime); font-weight: 700; }
    .st-completed { color: var(--lime); }
    .st-pausedDL, .st-pausedUP, .st-stopped, .st-stalledDL { color: var(--ink-faint); }
    .st-error, .st-missingFiles { color: #ff9a80; font-weight: 700; }

    td.ops button { padding: 3px 10px; font-size: 10.5px; margin-right: 4px; }
    td.ops .op-pause  { background: rgba(124,92,255,0.2); border-color: rgba(124,92,255,0.45); color: #c9bcff; }
    td.ops .op-resume { background: rgba(200,255,61,0.16); border-color: rgba(200,255,61,0.4); color: var(--lime); }
    td.ops .op-remove { background: rgba(255,107,74,0.14); border-color: rgba(255,107,74,0.4); color: #ff9a80; }

    .empty { text-align: center; color: var(--ink-faint); padding: 34px 0; }
  </style>
</head>
<body>
  <div class="blob" style="width:300px;height:260px;background:rgba(61,223,255,.3);top:-100px;left:-100px;"></div>
  <div class="blob" style="width:280px;height:240px;background:rgba(124,92,255,.4);bottom:-90px;right:-100px;"></div>

  <div class="topbar">
    <div class="brand"><div class="logo" style="width:26px;height:26px;font-size:12px">P</div></div>
    <select id="dl"></select>
    <button class="btn-ghost" id="refresh">刷新</button>
    <button class="op-pause btn-ghost" id="pauseAll" style="border-color:rgba(124,92,255,.45);color:#c9bcff">⏸ 全部暂停</button>
    <button class="btn-ghost" id="resumeAll" style="border-color:rgba(200,255,61,.4);color:var(--lime)">▶ 全部继续</button>
    <span style="flex:1"></span>
    <input id="addurl" placeholder="粘贴种子链接 / 磁力链接…" />
    <button class="btn-lime" id="add">添加</button>
  </div>

  <div class="speedline" id="stats">加载中…</div>

  <div class="tblwrap">
    <table>
      <thead><tr><th>名称</th><th>大小</th><th>进度</th><th>状态</th><th>↓速</th><th>↑速</th><th>分享率</th><th>操作</th></tr></thead>
      <tbody id="rows"><tr><td colspan="8" class="empty">加载中…</td></tr></tbody>
    </table>
  </div>

  <script type="module" src="downloads_page.js"></script>
</body>
</html>
