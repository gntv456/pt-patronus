<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>收藏与历史 · PTPatronus</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    .topbar {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px;
      background: rgba(7, 16, 14, 0.72);
      backdrop-filter: blur(24px) saturate(160%);
      border-bottom: 1px solid var(--glass-border);
    }
    .topbar h1 { margin: 0; font-size: 14px; flex: 1; }
    .tabs { display: flex; gap: 6px; }
    .tabs button { padding: 6px 16px; font-size: 12px; }
    .tabs button.on { background: linear-gradient(160deg, #e2ff8a, var(--lime-deep)); color: #0a1610; font-weight: 700; }

    .listwrap { margin: 12px 14px 18px; padding: 6px; overflow: auto; max-height: calc(100vh - 110px); }
    .row-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; margin-bottom: 6px;
      border-radius: var(--r-sm);
      background: linear-gradient(155deg, rgba(20,48,42,0.5), rgba(10,24,20,0.4));
      border: 1px solid rgba(168,196,180,0.09);
    }
    .row-item .t { flex: 1; min-width: 0; }
    .row-item .t .title { font-weight: 600; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-item .t .sub { font: 500 10.5px var(--mono); color: var(--ink-faint); margin-top: 2px; }
    .row-item .ops { display: flex; gap: 6px; flex: none; }
    .row-item .ops button { padding: 4px 11px; font-size: 10.5px; }
    .empty { text-align: center; color: var(--ink-faint); padding: 34px 0; }
  </style>
</head>
<body>
  <div class="blob" style="width:300px;height:260px;background:rgba(200,255,61,.2);top:-100px;left:-110px;"></div>
  <div class="blob" style="width:260px;height:230px;background:rgba(124,92,255,.4);bottom:-90px;right:-90px;"></div>

  <div class="topbar">
    <div class="brand"><div class="logo" style="width:26px;height:26px;font-size:12px">P</div><h1>收藏与下载历史</h1></div>
    <div class="tabs">
      <button class="btn-ghost on" id="tabFav">⭐ 收藏</button>
      <button class="btn-ghost" id="tabHis">🕘 历史</button>
    </div>
  </div>

  <div class="glass listwrap" id="list"></div>

  <!-- 跨站找同种（辅种）结果层：覆盖在列表上方 -->
  <div class="glass" id="reseedLayer" style="display:none; position:fixed; inset:60px 14px 14px; z-index:20; overflow-y:auto; padding:4px"></div>

  <script type="module" src="history_page.js"></script>
</body>
</html>
