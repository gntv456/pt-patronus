<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="theme.css" />
  <style>
    body { width: 378px; }

    /* ============ 顶栏：品牌 + 用户 ============ */
    .hero {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-raised);
    }
    .hero .who { margin-left: auto; display: flex; align-items: center; gap: 6px; }
    .hero .who .avatar {
      width: 32px; height: 32px; border-radius: 4px;
      display: grid; place-items: center;
      font-size: 13px; font-weight: 700; color: var(--color-on-accent);
      background: var(--accent); cursor: pointer;
      border: none; padding: 0; min-height: 32px;
    }
    .icon-btn { width: 32px; height: 32px; display: grid; place-items: center; padding: 0; font-size: 13px; }
    .icon-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

    /* ============ 搜索框（常驻顶部，种子/影视双模） ============ */
    .searchbar {
      display: flex; gap: 6px; padding: 9px 12px 0;
    }
    .searchbar .seg {
      display: flex; border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; flex: none;
    }
    .searchbar .seg button {
      padding: 6px 10px; min-height: 32px; font-size: 12px; border: none; cursor: pointer;
      background: var(--bg-raised); color: var(--ink-3);
    }
    .searchbar .seg button.on { background: var(--accent); color: var(--color-on-accent); font-weight: 600; }

    #status { font-size: 12px; color: var(--ink-2); padding: 5px 12px 2px; min-height: 16px; }

    /* ============ 内容区（Tab 面板） ============ */
    .panels { min-height: 318px; }
    .panel { display: none; }
    .panel.on { display: block; }

    /* —— 概览 Tab：数据卡 + 站点行 —— */
    .statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 12px; }
    #siteList { margin: 0 12px 8px; border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; max-height: 260px; overflow-y: auto; }
    .siteitem {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 10px; border-bottom: 1px solid var(--border);
      background: var(--bg-raised); font-size: 12px;
    }
    .siteitem:last-child { border-bottom: none; }
    .siteitem .fav { width: 16px; height: 16px; border-radius: 4px; flex: none; object-fit: cover; }
    .siteitem .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
    .siteitem .up { font: 600 12px var(--mono); color: var(--ok); font-variant-numeric: tabular-nums; }
    .siteitem .bad { font: 600 12px var(--mono); color: var(--danger); font-variant-numeric: tabular-nums; }

    /* —— 下载 Tab —— */
    .dlhead { display: flex; align-items: center; gap: 8px; padding: 8px 12px 4px; font: 500 12px var(--mono); color: var(--ink-2); }
    .dlhead .sp { margin-left: auto; }
    .dlhead .sp b { color: var(--ok); }
    #dlList { margin: 4px 12px 8px; border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; max-height: 268px; overflow-y: auto; }
    .dlitem { padding: 7px 10px; border-bottom: 1px solid var(--border); background: var(--bg-raised); }
    .dlitem:last-child { border-bottom: none; }
    .dlitem .dlrow { display: flex; align-items: center; gap: 6px; }
    .dlitem .t { flex: 1; font-size: 12px; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dlitem .m { display: flex; gap: 8px; margin-top: 2px; font: 400 12px var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .dlitem .m .spd { color: var(--accent); }
    .dlitem .ops { display: flex; gap: 4px; flex: none; }
    .dlitem .ops button { padding: 6px 10px; min-height: 24px; font-size: 12px; }

    /* —— 快捷 Tab —— */
    .qlist { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 10px 12px; }
    .qlist a {
      display: flex; align-items: center; gap: 7px;
      padding: 9px 10px; text-decoration: none; font-size: 12px; color: var(--ink-2);
      background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--r-md);
      cursor: pointer;
    }
    .qlist a:hover { background: var(--bg-hover); color: var(--ink); }
    .qlist a .ico { display: inline-flex; flex: none; }
    .qlist a .ico svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

    /* —— 搜索结果 —— */
    #results { display: flex; flex-direction: column; max-height: 336px; overflow-y: auto; margin: 0 12px 8px; }
    .item { padding: 7px 9px; border-bottom: 1px solid var(--border); background: var(--bg-raised); }
    .item:first-child { border-top-left-radius: var(--r-md); border-top-right-radius: var(--r-md); }
    .item:last-child { border-bottom-left-radius: var(--r-md); border-bottom-right-radius: var(--r-md); border-bottom: none; }
    .item:hover { background: var(--bg-hover); }
    .item .title { font-weight: 600; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
    .item .meta { display: flex; flex-wrap: wrap; gap: 3px 8px; margin-top: 2px; font: 400 12px var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .item .meta .free { color: var(--ok); font-weight: 600; }
    .item .actions { display: flex; gap: 6px; margin-top: 5px; }
    .item .actions button { padding: 6px 12px; min-height: 24px; font-size: 12px; }
    .item .actions .primary { background: var(--accent); border-color: var(--accent); color: var(--color-on-accent); font-weight: 600; }
    .item .actions .primary:hover { background: var(--accent-strong); }
    .sk-item { padding: 8px 9px; border-bottom: 1px solid var(--border); }
    .sk-item .ln { height: 10px; margin-bottom: 6px; }
    .sk-item .ln:last-child { width: 55%; margin-bottom: 0; }

    /* —— 拖放快捷条 —— */
    .dragbar { margin: 6px 12px 0; padding: 6px 9px; display: flex; gap: 8px; align-items: center; font-size: 12px; border-color: var(--accent); }

    /* ============ 底部：4 个导航 + 1 个独立签到 CTA ============ */
    .tabbar-wrap {
      border-top: 1px solid var(--border); background: var(--bg-raised);
      position: sticky; bottom: 0;
    }
    .tabbar { display: grid; grid-template-columns: repeat(4, 1fr); }
    .tabbar button {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 6px 0; min-height: 44px; border: none; cursor: pointer;
      background: transparent; color: var(--ink-2); font-size: 12px;
    }
    .tabbar button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .tabbar button.on { color: var(--accent); font-weight: 600; }
    .tabbar button:hover { color: var(--ink); }
    .tabbar button.on:hover { color: var(--accent); }
    .tabbar button.busy { pointer-events: none; opacity: 0.55; }
    .checkin-bar { padding: 6px 12px 10px; border-top: 1px solid var(--border); }
    .checkin-cta { width: 100%; min-height: 32px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .checkin-cta svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .checkin-cta.busy { pointer-events: none; opacity: 0.55; }
  </style>
</head>
<body>
  <header class="hero">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <h1>PTPatronus</h1>
    </div>
    <div class="who">
      <button class="avatar" id="userAvatar" type="button" aria-label="账号信息" style="display:none" title=""></button>
      <button class="btn-ghost icon-btn" id="openOptions" title="设置与登录" aria-label="设置"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.36.61 1.03 1 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </header>

  <!-- 常驻搜索：种子/影视双模 -->
  <div class="searchbar">
    <div class="seg" role="group" aria-label="搜索模式">
      <button id="modeTorrent" class="on" type="button">种子</button>
      <button id="modeMedia" type="button">影视</button>
    </div>
    <input id="keyword" placeholder="跨站搜索全部 PT 站…" aria-label="搜索关键词" style="flex:1" />
    <button class="btn-primary" id="search">搜索</button>
  </div>
  <div id="status" role="status" aria-live="polite">选中网页文字后打开本弹窗自动带入。</div>

  <div class="panels">
    <!-- ======== 概览 Tab ======== -->
    <section class="panel on" id="panel-home">
      <div class="statgrid" id="statsBox" style="display:none">
        <div class="chip"><span class="v" id="statUp">—</span><span class="k">总上传</span></div>
        <div class="chip"><span class="v" id="statSeed">—</span><span class="k">做种</span></div>
        <div class="chip"><span class="v" id="statBonus">—</span><span class="k">魔力值</span></div>
      </div>
      <div id="siteList"></div>
    </section>

    <!-- ======== 搜索 Tab ======== -->
    <section class="panel" id="panel-search">
      <div id="results"></div>
    </section>

    <!-- ======== 下载 Tab ======== -->
    <section class="panel" id="panel-dl">
      <div class="dlhead">
        <span id="dlName">下载器</span>
        <span class="sp">↓ <b id="dlDl">—</b> / ↑ <b id="dlUp">—</b></span>
      </div>
      <div id="dlList"></div>
    </section>

    <!-- ======== 快捷 Tab ======== -->
    <section class="panel" id="panel-quick">
      <div class="qlist" id="quickLinks"></div>
    </section>
  </div>

  <!-- 底部：4 个导航 + 1 个独立签到 CTA（动作不再混进导航） -->
  <div class="tabbar-wrap">
    <nav class="tabbar" aria-label="主导航">
      <button id="tabHome" class="on" type="button" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3 7 4-14 3 7h4"/></svg>概览</button>
      <button id="tabSearch" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>搜索</button>
      <button id="tabDl" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="M7.5 11l4.5 4.5L16.5 11"/><path d="M5 19.5h14"/></svg>下载</button>
      <button id="tabQuick" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>快捷</button>
    </nav>
    <div class="checkin-bar">
      <button class="btn-primary checkin-cta" id="checkin" type="button" aria-label="一键签到"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/><path d="M9 15l2 2 4-4"/></svg><span id="checkinTxt">签到</span></button>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
