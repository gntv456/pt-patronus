<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="theme.css" />
  <style>
    body { width: 360px; }

    /* 顶栏：紧凑单行 */
    .hero {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-raised);
    }
    .hero .who { margin-left: auto; display: flex; align-items: center; gap: 6px; }
    .hero .who .avatar {
      width: 22px; height: 22px;
      border-radius: 4px;
      display: grid; place-items: center;
      font-size: 11px; font-weight: 700; color: #fff;
      background: var(--accent);
    }
    .icon-btn { width: 26px; height: 26px; display: grid; place-items: center; padding: 0; font-size: 13px; }

    /* 搜索排 */
    .search-row { display: flex; gap: 6px; padding: 8px 10px 0; }
    .search-row input { flex: 1; }
    #status { font-size: 11px; color: var(--ink-3); padding: 5px 12px 2px; min-height: 16px; }

    /* 数据芯片行 */
    .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 6px 10px; }

    /* 导航行 */
    .nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 10px; }
    .nav a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 6px 4px;
      text-decoration: none;
      font-size: 11.5px;
      color: var(--ink-2);
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
    }
    .nav a:hover { background: var(--bg-hover); color: var(--ink); }
    .nav a .ico { font-size: 12px; }
    .nav a.busy { pointer-events: none; opacity: 0.55; }

    /* 结果列表 */
    #results { display: flex; flex-direction: column; max-height: 318px; overflow-y: auto; margin: 0 10px 10px; }
    .item {
      padding: 7px 9px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-raised);
    }
    .item:first-child { border-top-left-radius: var(--r-md); border-top-right-radius: var(--r-md); }
    .item:last-child { border-bottom-left-radius: var(--r-md); border-bottom-right-radius: var(--r-md); border-bottom: none; }
    .item:hover { background: var(--bg-hover); }
    .item .title {
      font-weight: 600;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--ink);
    }
    .item .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 3px 8px;
      margin-top: 2px;
      font: 400 10.5px var(--mono);
      color: var(--ink-3);
    }
    .item .meta .free { color: var(--ok); font-weight: 600; }
    .item .meta .seed { color: var(--ink-2); }
    .item .actions { display: flex; gap: 6px; margin-top: 5px; }
    .item .actions button { padding: 3px 10px; font-size: 11px; }
    .item .actions .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .item .actions .primary:hover { background: var(--accent-strong); }

    /* 骨架占位 */
    .sk-item { padding: 8px 9px; border-bottom: 1px solid var(--border); }
    .sk-item .ln { height: 10px; margin-bottom: 6px; }
    .sk-item .ln:last-child { width: 55%; margin-bottom: 0; }

    /* 拖放快捷条 */
    .dragbar {
      margin: 6px 10px 0;
      padding: 6px 9px;
      display: flex; gap: 8px; align-items: center;
      font-size: 11px;
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <h1>PTPatronus</h1>
    </div>
    <div class="who">
      <div class="avatar" id="userAvatar" style="display:none" title=""></div>
      <button class="btn-ghost icon-btn" id="openOptions" title="设置与登录" aria-label="设置">⚙</button>
    </div>
  </header>

  <div class="search-row">
    <input id="keyword" placeholder="跨站搜索全部 PT 站…" aria-label="搜索关键词" />
    <button class="btn-primary" id="search">搜索</button>
  </div>
  <div id="status">选中网页文字后打开本弹窗自动带入。</div>

  <div class="chips" id="statsBox" style="display:none">
    <div class="chip"><span class="v" id="statUp">—</span><span class="k">总上传</span></div>
    <div class="chip"><span class="v" id="statSeed">—</span><span class="k">做种</span></div>
    <div class="chip"><span class="v" id="statBonus">—</span><span class="k">魔力值</span></div>
  </div>

  <div class="nav">
    <a href="#" id="goSearch"><span class="ico">🔍</span>搜索页</a>
    <a href="#" id="goSubs"><span class="ico">📚</span>订阅</a>
    <a href="#" id="goDash"><span class="ico">📡</span>仪表盘</a>
    <a href="#" id="checkin"><span class="ico">📅</span><span id="checkinTxt">签到</span></a>
  </div>

  <div id="results"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
