<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="theme.css" />
  <style>
    body { width: 378px; }

    /* ============ 顶栏：品牌 + 用户 ============ */
    .hero {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-raised);
    }
    .hero .who { margin-left: auto; display: flex; align-items: center; gap: 6px; }
    .hero .who .avatar {
      width: 22px; height: 22px; border-radius: 4px;
      display: grid; place-items: center;
      font-size: 11px; font-weight: 700; color: #fff;
      background: var(--accent); cursor: pointer;
    }
    .icon-btn { width: 26px; height: 26px; display: grid; place-items: center; padding: 0; font-size: 13px; }

    /* ============ 搜索框（常驻顶部，种子/影视双模） ============ */
    .searchbar {
      display: flex; gap: 6px; padding: 9px 12px 0;
    }
    .searchbar .seg {
      display: flex; border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; flex: none;
    }
    .searchbar .seg button {
      padding: 5px 9px; font-size: 11px; border: none; cursor: pointer;
      background: var(--bg-raised); color: var(--ink-3);
    }
    .searchbar .seg button.on { background: var(--accent); color: #fff; font-weight: 600; }

    #status { font-size: 11px; color: var(--ink-3); padding: 5px 12px 2px; min-height: 16px; }

    /* ============ 内容区（Tab 面板） ============ */
    .panels { min-height: 318px; }
    .panel { display: none; }
    .panel.on { display: block; }

    /* —— 概览 Tab：数据卡 + 站点行 —— */
    .statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 12px; }
    #siteList { margin: 0 12px 8px; border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; max-height: 260px; overflow-y: auto; }
    .siteitem {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 10px; border-bottom: 1px solid var(--border);
      background: var(--bg-raised); font-size: 12px;
    }
    .siteitem:last-child { border-bottom: none; }
    .siteitem .fav { width: 16px; height: 16px; border-radius: 4px; flex: none; object-fit: cover; }
    .siteitem .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
    .siteitem .up { font: 600 11px var(--mono); color: var(--ok); }
    .siteitem .bad { font: 600 11px var(--mono); color: var(--danger); }

    /* —— 下载 Tab —— */
    .dlhead { display: flex; align-items: center; gap: 8px; padding: 8px 12px 4px; font: 500 11px var(--mono); color: var(--ink-3); }
    .dlhead .sp { margin-left: auto; }
    .dlhead .sp b { color: var(--ok); }
    #dlList { margin: 4px 12px 8px; border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; max-height: 268px; overflow-y: auto; }
    .dlitem { padding: 7px 10px; border-bottom: 1px solid var(--border); background: var(--bg-raised); }
    .dlitem:last-child { border-bottom: none; }
    .dlitem .dlrow { display: flex; align-items: center; gap: 6px; }
    .dlitem .t { flex: 1; font-size: 11.5px; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dlitem .m { display: flex; gap: 8px; margin-top: 2px; font: 400 10.5px var(--mono); color: var(--ink-3); }
    .dlitem .m .spd { color: var(--accent); }
    .dlitem .ops { display: flex; gap: 4px; flex: none; }
    .dlitem .ops button { padding: 1px 8px; font-size: 10.5px; }

    /* —— 快捷 Tab —— */
    .qlist { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 10px 12px; }
    .qlist a {
      display: flex; align-items: center; gap: 7px;
      padding: 9px 10px; text-decoration: none; font-size: 12px; color: var(--ink-2);
      background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--r-md);
      cursor: pointer;
    }
    .qlist a:hover { background: var(--bg-hover); color: var(--ink); }
    .qlist a .ico { font-size: 14px; }

    /* —— 搜索结果 —— */
    #results { display: flex; flex-direction: column; max-height: 336px; overflow-y: auto; margin: 0 12px 8px; }
    .item { padding: 7px 9px; border-bottom: 1px solid var(--border); background: var(--bg-raised); }
    .item:first-child { border-top-left-radius: var(--r-md); border-top-right-radius: var(--r-md); }
    .item:last-child { border-bottom-left-radius: var(--r-md); border-bottom-right-radius: var(--r-md); border-bottom: none; }
    .item:hover { background: var(--bg-hover); }
    .item .title { font-weight: 600; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
    .item .meta { display: flex; flex-wrap: wrap; gap: 3px 8px; margin-top: 2px; font: 400 10.5px var(--mono); color: var(--ink-3); }
    .item .meta .free { color: var(--ok); font-weight: 600; }
    .item .actions { display: flex; gap: 6px; margin-top: 5px; }
    .item .actions button { padding: 3px 10px; font-size: 11px; }
    .item .actions .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .item .actions .primary:hover { background: var(--accent-strong); }
    .sk-item { padding: 8px 9px; border-bottom: 1px solid var(--border); }
    .sk-item .ln { height: 10px; margin-bottom: 6px; }
    .sk-item .ln:last-child { width: 55%; margin-bottom: 0; }

    /* —— 拖放快捷条 —— */
    .dragbar { margin: 6px 12px 0; padding: 6px 9px; display: flex; gap: 8px; align-items: center; font-size: 11px; border-color: var(--accent); }

    /* ============ 底部 Tab 栏（MP 式固定五格） ============ */
    .tabbar {
      display: grid; grid-template-columns: repeat(5, 1fr);
      border-top: 1px solid var(--border); background: var(--bg-raised);
      position: sticky; bottom: 0;
    }
    .tabbar button {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 7px 0 6px; border: none; cursor: pointer;
      background: transparent; color: var(--ink-3); font-size: 10px;
    }
    .tabbar button .ico { font-size: 15px; line-height: 1; }
    .tabbar button.on { color: var(--accent); font-weight: 600; }
    .tabbar button:hover { color: var(--ink); }
    .tabbar button.on:hover { color: var(--accent); }
    .tabbar button.busy { pointer-events: none; opacity: 0.55; }
  </style>
</head>
<body>
  <header class="hero">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <h1>PTPatronus</h1>
    </div>
    <div class="who">
      <div class="avatar" id="userAvatar" style="display:none" title=""></div>
      <button class="btn-ghost icon-btn" id="openOptions" title="设置与登录" aria-label="设置">⚙</button>
    </div>
  </header>

  <!-- 常驻搜索：种子/影视双模（对标 MP 顶栏搜索） -->
  <div class="searchbar">
    <div class="seg" role="tablist">
      <button id="modeTorrent" class="on" type="button">种子</button>
      <button id="modeMedia" type="button">影视</button>
    </div>
    <input id="keyword" placeholder="跨站搜索全部 PT 站…" aria-label="搜索关键词" style="flex:1" />
    <button class="btn-primary" id="search">搜索</button>
  </div>
  <div id="status">选中网页文字后打开本弹窗自动带入。</div>

  <div class="panels">
    <!-- ======== 概览 Tab ======== -->
    <section class="panel on" id="panel-home">
      <div class="statgrid" id="statsBox" style="display:none">
        <div class="chip"><span class="v" id="statUp">—</span><span class="k">总上传</span></div>
        <div class="chip"><span class="v" id="statSeed">—</span><span class="k">做种</span></div>
        <div class="chip"><span class="v" id="statBonus">—</span><span class="k">魔力值</span></div>
      </div>
      <div id="siteList"></div>
    </section>

    <!-- ======== 搜索 Tab ======== -->
    <section class="panel" id="panel-search">
      <div id="results"></div>
    </section>

    <!-- ======== 下载 Tab ======== -->
    <section class="panel" id="panel-dl">
      <div class="dlhead">
        <span id="dlName">下载器</span>
        <span class="sp">↓ <b id="dlDl">—</b> / ↑ <b id="dlUp">—</b></span>
      </div>
      <div id="dlList"></div>
    </section>

    <!-- ======== 快捷 Tab ======== -->
    <section class="panel" id="panel-quick">
      <div class="qlist" id="quickLinks"></div>
    </section>
  </div>

  <!-- 底部 Tab 栏 -->
  <nav class="tabbar">
    <button id="tabHome" class="on" type="button"><span class="ico">📡</span>概览</button>
    <button id="tabSearch" type="button"><span class="ico">🔍</span>搜索</button>
    <button id="tabDl" type="button"><span class="ico">⬇️</span>下载</button>
    <button id="tabQuick" type="button"><span class="ico">⚡</span>快捷</button>
    <button id="checkin" type="button"><span class="ico">📅</span><span id="checkinTxt">签到</span></button>
  </nav>

  <script type="module" src="popup.js"></script>
</body>
</html>
