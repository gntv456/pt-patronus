<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    body { width: 340px; margin: 0; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; color: #e8eaf0; background: #1b1e28; }
    .head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 8px; }
    .head h1 { font-size: 14px; margin: 0; }
    .gear { cursor: pointer; opacity: .7; background: none; border: none; color: inherit; font-size: 14px; }
    .gear:hover { opacity: 1; }
    .body { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; }
    .search-row { display: flex; gap: 6px; }
    .search-row input { flex: 1; padding: 7px 9px; border-radius: 6px; border: 1px solid #3a3f4f; background: #242836; color: inherit; }
    .search-row button { padding: 7px 12px; border-radius: 6px; border: none; background: #4f7cff; color: #fff; cursor: pointer; }
    .tip { color: #8b93a7; font-size: 12px; }
    .results { max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .item { padding: 8px; border-radius: 6px; background: #242836; display: flex; flex-direction: column; gap: 4px; }
    .item .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .meta { color: #8b93a7; font-size: 12px; display: flex; gap: 8px; align-items: center; }
    .item .actions { display: flex; gap: 6px; margin-top: 2px; }
    .item .actions button { flex: none; padding: 3px 8px; font-size: 12px; border-radius: 4px; border: 1px solid #3a3f4f; background: #2c3145; color: inherit; cursor: pointer; }
    .item .actions button.primary { background: #4f7cff; border-color: #4f7cff; color: #fff; }
    .item .actions button:disabled { opacity: .5; cursor: default; }
    .empty { text-align: center; color: #8b93a7; padding: 18px 0; }
    .warn { color: #f5a623; padding: 4px 0; }
    .links { display: flex; gap: 6px; flex-wrap: wrap; }
    .links a { color: #7ea3ff; text-decoration: none; padding: 3px 8px; border-radius: 4px; background: #242836; }
    .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid #4f7cff; border-top-color: transparent; border-radius: 50%; animation: r 0.8s linear infinite; }
    @keyframes r { to { transform: rotate(360deg) } }
  </style>
</head>
<body>
  <div class="head">
    <h1>PTPatronus 助手</h1>
    <button class="gear" id="openOptions" title="设置服务器与 API Key">⚙</button>
  </div>
  <div class="body">
    <div class="search-row">
      <input id="keyword" placeholder="输入关键词跨站搜索…" />
      <button id="search">搜索</button>
    </div>
    <div id="status" class="tip">选中网页文字后点扩展，或直接输入关键词。</div>
    <div class="links">
      <a href="#" id="goSearch">Web 搜索页</a>
      <a href="#" id="goSubs">订阅管理</a>
      <a href="#" id="goDash">仪表盘</a>
    </div>
    <div id="results" class="results"></div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
