<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>站点数据 · PTPatronus</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    .topbar {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px;
      background: rgba(7, 16, 14, 0.72);
      backdrop-filter: blur(24px) saturate(160%);
      border-bottom: 1px solid var(--glass-border);
    }
    .topbar h1 { margin: 0; font-size: 14px; flex: 1; }
    .topbar button { padding: 6px 14px; font-size: 11px; }

    /* 汇总数据矩阵：撞色芯片墙 */
    .matrix {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 12px 14px 6px;
    }
    .matrix .chip .v { font-size: 15px; }

    /* 表格面板 */
    .tblwrap { margin: 8px 14px 18px; padding: 4px; overflow: auto; max-height: calc(100vh - 218px); }
    td.name { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    td .lv { color: var(--lime); font-size: 10.5px; font-weight: 700; }
    td.mono, .num { font-family: var(--mono); font-size: 11.5px; }
    tr.nodata td { background: rgba(255, 107, 74, 0.05); }
    tr.nodata td.name { color: #ff9a80; }
    .empty { text-align: center; color: var(--ink-faint); padding: 34px 0; }
    #totals .err { padding: 10px 14px; }
  </style>
</head>
<body>
  <div class="blob" style="width:320px;height:280px;background:rgba(200,255,61,.22);top:-100px;right:-110px;"></div>
  <div class="blob" style="width:260px;height:240px;background:rgba(124,92,255,.4);bottom:-90px;left:-90px;"></div>

  <div class="topbar">
    <div class="brand"><div class="logo" style="width:26px;height:26px;font-size:12px">P</div><h1>站点数据总览</h1></div>
    <button class="btn-violet" id="sync">⟳ 即时抓取</button>
    <button class="btn-ghost" id="refresh">刷新</button>
    <button class="btn-ghost" id="expJson" title="导出完整数据 JSON">📤 JSON</button>
    <button class="btn-ghost" id="expCsv" title="导出站点明细 CSV（Excel 兼容）">📤 CSV</button>
  </div>

  <div class="matrix" id="totals"></div>

  <div class="glass tblwrap">
    <table>
      <thead><tr><th>站点</th><th>等级</th><th>上传</th><th>下载</th><th>分享率</th><th>做种</th><th>做种体积</th><th>魔力</th><th>魔力/时</th></tr></thead>
      <tbody id="rows"><tr><td colspan="9" class="empty">加载中…</td></tr></tbody>
    </table>
  </div>

  <script type="module" src="stats_page.js"></script>
</body>
</html>
