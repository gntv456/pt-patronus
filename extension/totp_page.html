<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>两步验证器 · PTPatronus</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; position: relative; z-index: 1; }
    .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .topbar h1 { margin: 0; font-size: 15px; flex: 1; }
    #msg { font-size: 12px; }

    .panel { padding: 16px; margin-bottom: 12px; }
    form.add { display: grid; grid-template-columns: 1.4fr 1fr auto; gap: 8px; margin-top: 10px; }

    /* —— 验证码卡：水润玻璃胶囊卡，代码是主角 —— */
    .entry {
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-radius: var(--r-lg);
      background: linear-gradient(150deg, rgba(20,48,42,0.5), rgba(10,24,20,0.4));
      border: 1px solid var(--glass-border-dim);
      backdrop-filter: var(--blur);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), 0 10px 26px rgba(2,8,6,0.4);
      transition: border-color 0.15s, transform 0.15s;
    }
    .entry:hover { border-color: rgba(200,255,61,0.35); transform: translateY(-1px); }
    .entry .code {
      font: 700 27px/1 var(--mono);
      letter-spacing: 5px;
      cursor: pointer;
      user-select: all;
      background: linear-gradient(95deg, var(--lime), var(--aqua) 60%, var(--violet));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 14px rgba(200,255,61,0.3));
    }
    .entry .meta { flex: 1; min-width: 0; }
    .entry .meta .label { font-weight: 700; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* 倒计时：水润光柱（由 JS 按剩余秒着色） */
    .entry .bar { height: 5px; border-radius: 5px; background: rgba(5,16,12,0.7); box-shadow: inset 0 1px 3px rgba(0,0,0,0.6); overflow: hidden; margin-top: 7px; }
    .entry .bar > div { height: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--lime-deep), var(--lime)); box-shadow: 0 0 8px rgba(200,255,61,0.45); }
    .entry .bar.warn > div { background: linear-gradient(90deg, var(--coral-deep), var(--coral)); box-shadow: 0 0 8px rgba(255,107,74,0.45); }
    .del {
      background: rgba(255,107,74,0.12);
      border: 1px solid rgba(255,107,74,0.35);
      color: #ff9a80;
      border-radius: 999px;
      width: 30px; height: 30px;
      padding: 0;
      font-size: 13px;
      cursor: pointer;
    }
    .empty { text-align: center; color: var(--ink-faint); padding: 26px 0; }
  </style>
</head>
<body>
  <div class="blob" style="width:280px;height:250px;background:rgba(124,92,255,.45);top:-90px;right:-100px;"></div>
  <div class="blob" style="width:240px;height:210px;background:rgba(200,255,61,.25);bottom:-80px;left:-80px;"></div>

  <div class="wrap">
    <header class="topbar">
      <div class="brand"><div class="logo" style="width:28px;height:28px;font-size:13px">P</div><h1>两步验证器</h1></div>
      <span id="msg"></span>
      <button class="btn-ghost" id="lock" style="display:none">🔒 锁定</button>
    </header>

    <!-- 解锁 / 首次设 PIN -->
    <div id="gate" class="glass panel">
      <div class="eyebrow">保险库 · VAULT</div>
      <div class="hint" style="margin-top:6px">验证器条目存本机 <code class="mono">chrome.storage.local</code>。设置 PIN 后以 AES-256-GCM（PBKDF2-SHA256 ×310k）加密，每次打开需解锁；留空保存则不加密。</div>
      <form id="unlockForm" class="add">
        <input id="pin" type="password" placeholder="PIN（首次输入即设定）" />
        <button type="submit" id="unlockBtn" class="btn-lime">解锁 / 设置 PIN</button>
      </form>
    </div>

    <div id="main" style="display:none">
      <div class="glass panel">
        <div class="eyebrow">添加条目 · ADD</div>
        <form id="addForm" class="add">
          <input id="secret" placeholder="otpauth:// 链接 或 base32 秘钥（必填）" required />
          <input id="label" placeholder="标签，如 站点昵称（可空）" />
          <button type="submit" class="btn-violet">添加</button>
        </form>
        <div class="hint" style="margin-top:8px">点击验证码复制；代码按剩余时间着色。数据仅保存在本浏览器。</div>
        <div style="display:flex; gap:8px; margin-top:10px">
          <button type="button" class="btn-ghost" id="btnExport">📤 导出备份</button>
          <button type="button" class="btn-ghost" id="btnImport">📥 导入备份</button>
        </div>
      </div>
      <div id="list"></div>
    </div>
  </div>
  <script type="module" src="totp_page.js"></script>
</body>
</html>
